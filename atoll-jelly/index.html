<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Atoll Jelly — WebGPU Diorama</title>
<style>
  :root{
    --ink:#eaf6f5;
    --dim:rgba(214,238,236,.62);
    --glass:rgba(9,26,32,.52);
    --edge:rgba(160,225,220,.20);
    --accent:#57e0c8;
    --accent-warm:#ffb27a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#04131a;color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #gfx{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gfx.dragging{cursor:grabbing}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 42%,rgba(0,8,12,.42) 100%)}

  .title{position:fixed;left:clamp(18px,3.2vw,40px);top:clamp(16px,3vw,34px);z-index:5;pointer-events:none}
  .title h1{margin:0;font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:400;
    font-size:clamp(26px,3.4vw,44px);letter-spacing:.055em;line-height:1;
    text-shadow:0 2px 30px rgba(0,20,26,.75)}
  .title p{margin:9px 0 0;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim)}

  .panel{position:fixed;z-index:6;left:clamp(14px,3vw,38px);bottom:clamp(14px,3vw,34px);
    width:min(392px,calc(100vw - 28px));padding:16px 17px 15px;
    background:var(--glass);border:1px solid var(--edge);border-radius:16px;
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 24px 60px -22px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.07);
    transition:opacity .35s ease, transform .35s ease}
  .panel.away{opacity:0;transform:translateY(16px);pointer-events:none}

  .row{margin-bottom:13px}
  .row:last-child{margin-bottom:0}
  .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .lab span:first-child{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .val{font-size:11px;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:.04em}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;
    background:linear-gradient(90deg,rgba(87,224,200,.85),rgba(87,224,200,.18))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5.5px;
    border-radius:50%;background:#eafffb;border:1px solid rgba(0,40,40,.5);
    box-shadow:0 0 0 4px rgba(87,224,200,.16),0 2px 6px rgba(0,0,0,.5);transition:box-shadow .2s}
  input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 7px rgba(87,224,200,.22),0 2px 8px rgba(0,0,0,.5)}
  input[type=range]:focus-visible{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 7px rgba(87,224,200,.4)}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(87,224,200,.35)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#eafffb;border:none}

  .stops{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:3px}
  .stops button{all:unset;text-align:center;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:6px 0 5px;border-radius:7px;color:var(--dim);cursor:pointer;
    border:1px solid transparent;transition:color .2s,background .2s,border-color .2s}
  .stops button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .stops button.on{color:#04191c;background:rgba(87,224,200,.86);border-color:rgba(255,255,255,.25)}

  .foot{display:flex;gap:8px;align-items:center;margin-top:14px;padding-top:12px;
    border-top:1px solid rgba(160,225,220,.14)}
  .btn{all:unset;display:inline-flex;align-items:center;gap:7px;cursor:pointer;flex:0 0 auto;
    font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
    padding:7px 11px;border-radius:8px;border:1px solid rgba(160,225,220,.18);
    transition:color .2s,background .2s,border-color .2s}
  .btn:hover{color:var(--ink);background:rgba(255,255,255,.06)}
  .btn[aria-pressed=true]{color:#04191c;background:rgba(87,224,200,.82);border-color:transparent}
  .btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
  .btn[aria-pressed=true] .dot{opacity:1;box-shadow:0 0 10px rgba(255,255,255,.7)}
  .hint{flex:1 1 auto;min-width:0;margin:0;font-size:9.5px;letter-spacing:.02em;
    color:rgba(214,238,236,.42);text-align:right;line-height:1.7;white-space:nowrap}

  #boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#04131a;
    transition:opacity .6s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .in{text-align:center}
  #boot .ring{width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
    border:1.5px solid rgba(87,224,200,.18);border-top-color:var(--accent);
    animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot p{margin:0;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}

  #err{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:28px;background:#04131a}
  #err.show{display:grid}
  #err .box{max-width:620px;border:1px solid rgba(255,120,110,.32);border-radius:14px;padding:22px 24px;
    background:rgba(30,10,12,.6)}
  #err h2{margin:0 0 10px;font-size:15px;letter-spacing:.08em;font-weight:600;color:#ffb4ac}
  #err pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.65;
    color:rgba(255,235,232,.82);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  @media (max-width:720px){
    .title p{display:none}
    .panel{width:calc(100vw - 24px);left:12px;bottom:12px;padding:13px 14px}
    .row{margin-bottom:10px}
    .hint{display:none}
  }
</style>
</head>
<body>
<canvas id="gfx"></canvas>
<div id="vignette"></div>

<div class="title">
  <h1>Atoll Jelly</h1>
  <p>A Maldives sandbar · WebGPU / WGSL</p>
</div>

<div class="panel" id="panel">
  <div class="row">
    <div class="lab"><span>Time of day</span><span class="val" id="vTime">Dawn</span></div>
    <input type="range" id="sTime" min="0" max="3" step="0.01" value="0.35" aria-label="Time of day">
    <div class="stops" id="stops">
      <button data-t="0">Dawn</button>
      <button data-t="1">Noon</button>
      <button data-t="2">Golden</button>
      <button data-t="3">Night</button>
    </div>
  </div>
  <div class="row">
    <div class="lab"><span>Tide height</span><span class="val" id="vTide">0.00</span></div>
    <input type="range" id="sTide" min="-1" max="1" step="0.01" value="0.05" aria-label="Tide height">
  </div>
  <div class="row">
    <div class="lab"><span>Wave energy</span><span class="val" id="vWave">0.45</span></div>
    <input type="range" id="sWave" min="0" max="1" step="0.01" value="0.45" aria-label="Wave energy">
  </div>
  <div class="foot">
    <button class="btn" id="bSound" aria-pressed="false"><span class="dot"></span>Sound</button>
    <button class="btn" id="bHide" title="Hide panel (H)">Hide</button>
    <div class="hint">drag to orbit · scroll to zoom<br>click the water to drop a pebble</div>
  </div>
</div>

<div id="boot"><div class="in"><div class="ring"></div><p>Booting WebGPU</p></div></div>
<div id="err"><div class="box"><h2>Atoll Jelly could not start</h2><pre id="errMsg"></pre></div></div>

<script type="module">
// ============================================================================
// Atoll Jelly — a single-file WebGPU sandbar diorama.
// No dependencies: camera, geometry, sky, water and audio are all hand rolled.
// ============================================================================

const $ = (id) => document.getElementById(id);
const bootEl = $('boot'), errEl = $('err'), errMsg = $('errMsg');

function fail(e) {
  console.error(e);
  errMsg.textContent = (e && (e.stack || e.message)) || String(e);
  errEl.classList.add('show');
  bootEl.classList.add('gone');
}

// ---------------------------------------------------------------------------
// Small math kit (column-major matrices, right-handed, depth 0..1 for WebGPU)
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2;

function perspective(out, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy * 0.5);
  out.fill(0);
  out[0] = f / aspect;
  out[5] = f;
  out[10] = far / (near - far);
  out[11] = -1;
  out[14] = (near * far) / (near - far);
  return out;
}

function lookAt(out, eye, center, up) {
  let zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
  let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
  let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
  l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
  out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
  out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
  out[15] = 1;
  return out;
}

function mulMat(out, a, b) {
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    for (let r = 0; r < 4; r++) {
      out[c * 4 + r] = a[r] * b0 + a[4 + r] * b1 + a[8 + r] * b2 + a[12 + r] * b3;
    }
  }
  return out;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

// Deterministic pseudo random so the island looks identical every load.
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry(20261021);

// ---------------------------------------------------------------------------
// Island height field — mirrored exactly in WGSL (terrainY)
// ---------------------------------------------------------------------------
function terrainAt(x, z) {
  const th = Math.atan2(z, x);
  const rr = Math.hypot(x, z) * (1 + 0.10 * Math.sin(3 * th + 1.1) + 0.055 * Math.sin(5 * th - 0.6) + 0.03 * Math.sin(8 * th + 2.3));
  let y = 0.95 - 0.055 * rr;
  y = lerp(y, -0.35, smoothstep(2.6, 5.2, rr));
  y = lerp(y, -1.45, smoothstep(5.2, 10.0, rr));
  y = lerp(y, -4.60, smoothstep(10.0, 26.0, rr));
  y += 0.05 * Math.sin(rr * 3.4 + th * 2.0) * smoothstep(1.5, 4.0, rr) * (1 - smoothstep(6.0, 12.0, rr));
  return y;
}

// ---------------------------------------------------------------------------
// Geometry builder: every prop in the scene is welded into a few big meshes so
// the whole diorama draws in a handful of calls.
// ---------------------------------------------------------------------------
class Geo {
  constructor() { this.p = []; this.n = []; this.c = []; this.s = []; this.i = []; }
  v(p, n, c, s) {
    this.p.push(p[0], p[1], p[2]);
    this.n.push(n[0], n[1], n[2]);
    this.c.push(c[0], c[1], c[2]);
    this.s.push(s);
    return this.p.length / 3 - 1;
  }
  quadN(a, b, c, d, n, col, sway) {
    const i0 = this.v(a, n, col, sway), i1 = this.v(b, n, col, sway),
          i2 = this.v(c, n, col, sway), i3 = this.v(d, n, col, sway);
    this.i.push(i0, i1, i2, i0, i2, i3);
  }
  quad(a, b, c, d, col, sway) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l; ny /= l; nz /= l;
    // leaves get lit from whichever side faces the sky
    if (ny < 0) { nx = -nx; ny = -ny; nz = -nz; }
    this.quadN(a, b, c, d, [nx, ny, nz], col, sway);
  }
  // Axis box, optionally yaw-rotated, with flat per-face normals.
  box(cx, cy, cz, sx, sy, sz, col, yaw = 0, sway = 0, shade = 1) {
    const hx = sx / 2, hy = sy / 2, hz = sz / 2;
    const cs = Math.cos(yaw), sn = Math.sin(yaw);
    const P = (x, y, z) => [cx + x * cs - z * sn, cy + y, cz + x * sn + z * cs];
    const N = (x, z) => [x * cs - z * sn, 0, x * sn + z * cs];
    const c = [col[0] * shade, col[1] * shade, col[2] * shade];
    const ny = [0, 1, 0], nd = [0, -1, 0];
    this.quadN(P(-hx, hy, -hz), P(-hx, hy, hz), P(hx, hy, hz), P(hx, hy, -hz), ny, c, sway);
    this.quadN(P(-hx, -hy, -hz), P(hx, -hy, -hz), P(hx, -hy, hz), P(-hx, -hy, hz), nd, c, sway);
    const nz1 = N(0, 1), nz2 = N(0, -1), nx1 = N(1, 0), nx2 = N(-1, 0);
    this.quadN(P(-hx, -hy, hz), P(hx, -hy, hz), P(hx, hy, hz), P(-hx, hy, hz), nz1, c, sway);
    this.quadN(P(hx, -hy, -hz), P(-hx, -hy, -hz), P(-hx, hy, -hz), P(hx, hy, -hz), nz2, c, sway);
    this.quadN(P(hx, -hy, hz), P(hx, -hy, -hz), P(hx, hy, -hz), P(hx, hy, hz), nx1, c, sway);
    this.quadN(P(-hx, -hy, -hz), P(-hx, -hy, hz), P(-hx, hy, hz), P(-hx, hy, -hz), nx2, c, sway);
  }
  // Tapered cylinder from a to b.
  tube(a, b, r0, r1, seg, col, sway = 0) {
    let ax = b[0] - a[0], ay = b[1] - a[1], az = b[2] - a[2];
    const len = Math.hypot(ax, ay, az) || 1;
    ax /= len; ay /= len; az /= len;
    let ux = 0, uy = 1, uz = 0;
    if (Math.abs(ay) > 0.94) { ux = 1; uy = 0; uz = 0; }
    let rx = uy * az - uz * ay, ry = uz * ax - ux * az, rz = ux * ay - uy * ax;
    let l = Math.hypot(rx, ry, rz) || 1; rx /= l; ry /= l; rz /= l;
    const sx = ay * rz - az * ry, sy = az * rx - ax * rz, sz = ax * ry - ay * rx;
    for (let i = 0; i < seg; i++) {
      const t0 = (i / seg) * TAU, t1 = ((i + 1) / seg) * TAU;
      const c0 = Math.cos(t0), s0 = Math.sin(t0), c1 = Math.cos(t1), s1 = Math.sin(t1);
      const n0 = [rx * c0 + sx * s0, ry * c0 + sy * s0, rz * c0 + sz * s0];
      const n1 = [rx * c1 + sx * s1, ry * c1 + sy * s1, rz * c1 + sz * s1];
      const a0 = [a[0] + n0[0] * r0, a[1] + n0[1] * r0, a[2] + n0[2] * r0];
      const a1 = [a[0] + n1[0] * r0, a[1] + n1[1] * r0, a[2] + n1[2] * r0];
      const b0 = [b[0] + n0[0] * r1, b[1] + n0[1] * r1, b[2] + n0[2] * r1];
      const b1 = [b[0] + n1[0] * r1, b[1] + n1[1] * r1, b[2] + n1[2] * r1];
      const i0 = this.v(a0, n0, col, sway), i1 = this.v(a1, n1, col, sway),
            i2 = this.v(b1, n1, col, sway), i3 = this.v(b0, n0, col, sway);
      this.i.push(i0, i1, i2, i0, i2, i3);
    }
  }
  sphere(cx, cy, cz, rx, ry, rz, col, sway = 0, rings = 8, sides = 12, colTop = null) {
    for (let j = 0; j < rings; j++) {
      const p0 = (j / rings) * Math.PI, p1 = ((j + 1) / rings) * Math.PI;
      for (let i = 0; i < sides; i++) {
        const t0 = (i / sides) * TAU, t1 = ((i + 1) / sides) * TAU;
        const V = (p, t) => {
          const sp = Math.sin(p), cp = Math.cos(p);
          return [cx + rx * sp * Math.cos(t), cy + ry * cp, cz + rz * sp * Math.sin(t)];
        };
        const N = (p, t) => {
          const sp = Math.sin(p), cp = Math.cos(p);
          const x = sp * Math.cos(t) / rx, y = cp / ry, z = sp * Math.sin(t) / rz;
          const l = Math.hypot(x, y, z) || 1;
          return [x / l, y / l, z / l];
        };
        const a = V(p0, t0), b = V(p0, t1), c = V(p1, t1), d = V(p1, t0);
        const na = N(p0, t0), nb = N(p0, t1), nc = N(p1, t1), nd = N(p1, t0);
        const cc = colTop && j < rings * 0.55 ? colTop : col;
        const i0 = this.v(a, na, cc, sway), i1 = this.v(b, nb, cc, sway),
              i2 = this.v(c, nc, cc, sway), i3 = this.v(d, nd, cc, sway);
        this.i.push(i0, i1, i2, i0, i2, i3);
      }
    }
  }
  build() {
    return {
      pos: new Float32Array(this.p),
      nrm: new Float32Array(this.n),
      col: new Float32Array(this.c),
      sway: new Float32Array(this.s),
      idx: new Uint32Array(this.i),
      count: this.i.length,
    };
  }
}

// Palette
const SAND   = [0.83, 0.77, 0.62];
const WOOD   = [0.52, 0.36, 0.24];
const WOOD_D = [0.36, 0.24, 0.16];
const WOOD_L = [0.62, 0.45, 0.30];
const STRAW  = [0.60, 0.46, 0.26];
const STRAW_L= [0.70, 0.55, 0.31];
const LEAF   = [0.20, 0.44, 0.20];
const LEAF_L = [0.36, 0.58, 0.24];
const TRUNK  = [0.42, 0.34, 0.25];

// ---------------------------------------------------------------------------
// Palm fronds: a drooping ribbon with a sway weight that grows toward the tip
// ---------------------------------------------------------------------------
function addFrond(g, base, yaw, len, wid, droop, col, swayScale) {
  const N = 7;
  const dx = Math.cos(yaw), dz = Math.sin(yaw);
  const rx = -dz, rz = dx;
  let prevL = null, prevR = null;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const along = t * len;
    const y = base[1] + len * (0.24 * t - 0.80 * t * t * droop);
    const px = base[0] + dx * along, pz = base[2] + dz * along;
    const w = wid * Math.sin(Math.PI * Math.min(t * 1.18, 1)) * (1 - 0.32 * t) * 0.5;
    const L = [px + rx * w, y, pz + rz * w];
    const R = [px - rx * w, y - 0.012, pz - rz * w];
    if (prevL) g.quad(prevL, prevR, R, L, col, (0.30 + 0.70 * t) * swayScale);
    prevL = L; prevR = R;
  }
}

// One thatched cone with a ragged, drooping rim.
function thatchCone(g, cx, cy, cz, rx, rz, h, segs, shade) {
  for (let i = 0; i < segs; i++) {
    const t0 = (i / segs) * TAU, t1 = ((i + 1) / segs) * TAU;
    const j0 = 1 + 0.055 * Math.sin(i * 2.7), j1 = 1 + 0.055 * Math.sin((i + 1) * 2.7);
    const droop = 0.09 + 0.05 * Math.sin(i * 1.9);
    const a  = [cx + Math.cos(t0) * rx * j0, cy - droop, cz + Math.sin(t0) * rz * j0];
    const b  = [cx + Math.cos(t1) * rx * j1, cy - droop, cz + Math.sin(t1) * rz * j1];
    const m0 = [cx + Math.cos(t0) * rx * 0.56, cy + h * 0.56, cz + Math.sin(t0) * rz * 0.56];
    const m1 = [cx + Math.cos(t1) * rx * 0.56, cy + h * 0.56, cz + Math.sin(t1) * rz * 0.56];
    const ap = [cx, cy + h, cz];
    const cA = [STRAW[0] * shade, STRAW[1] * shade, STRAW[2] * shade];
    const cB = [STRAW_L[0] * shade, STRAW_L[1] * shade, STRAW_L[2] * shade];
    g.quad(a, b, m1, m0, cA, 0);
    g.quad(m0, m1, ap, ap, cB, 0);
  }
}

// Layered hip roof: a wide fringe skirt, the main cone, and a small ridge cap.
function thatchRoof(g, cx, cy, cz, w, d, h) {
  thatchCone(g, cx, cy - 0.05, cz, w * 0.50, d * 0.50, h * 0.42, 16, 1.0);
  thatchCone(g, cx, cy + h * 0.26, cz, w * 0.38, d * 0.38, h * 0.48, 14, 1.10);
  thatchCone(g, cx, cy + h * 0.58, cz, w * 0.20, d * 0.20, h * 0.40, 12, 1.22);
  g.tube([cx, cy + h * 0.86, cz], [cx, cy + h * 1.06, cz], w * 0.055, 0.012, 8, STRAW_L);
}

function palm(g, x, z, h, lean, seed) {
  const r = mulberry(seed);
  const baseY = terrainAt(x, z) - 0.12;
  const dir = r() * TAU;
  const lx = Math.cos(dir), lz = Math.sin(dir);
  const segs = 9;
  let prev = [x, baseY, z];
  for (let i = 1; i <= segs; i++) {
    const t = i / segs;
    const bend = lean * t * t * h * 0.42;
    const p = [x + lx * bend, baseY + h * t, z + lz * bend];
    const r0 = 0.125 * (1 - 0.58 * ((i - 1) / segs));
    const r1 = 0.125 * (1 - 0.58 * t);
    const sh = 0.80 + 0.20 * (i % 2) + 0.06 * Math.sin(i * 5.1);
    g.tube(prev, p, Math.max(0.05, r0), Math.max(0.045, r1), 7,
           [TRUNK[0] * sh, TRUNK[1] * sh, TRUNK[2] * sh], t * t * 0.5);
    prev = p;
  }
  const top = prev;
  const fronds = 9 + Math.floor(r() * 3);
  for (let i = 0; i < fronds; i++) {
    const yaw = (i / fronds) * TAU + r() * 0.45;
    const len = h * (0.40 + r() * 0.18);
    const col = i % 2 ? LEAF : LEAF_L;
    addFrond(g, top, yaw, len, 0.40 + r() * 0.14, 0.80 + r() * 0.40, col, 0.72 + 0.28 * r());
  }
  for (let i = 0; i < 3; i++) {
    const a = r() * TAU;
    g.sphere(top[0] + Math.cos(a) * 0.15, top[1] - 0.15, top[2] + Math.sin(a) * 0.15,
             0.085, 0.095, 0.085, [0.33, 0.27, 0.15], 0.85, 5, 7);
  }
}

const DECK_Y = 1.16;

function boardwalk(g, x0, z0, x1, z1, width) {
  const dx = x1 - x0, dz = z1 - z0;
  const len = Math.hypot(dx, dz);
  const yaw = Math.atan2(dx, dz);
  const n = Math.max(2, Math.round(len / 0.37));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const px = x0 + dx * t, pz = z0 + dz * t;
    const sh = 0.82 + 0.22 * ((i * 5) % 4) / 3;
    g.box(px, DECK_Y - 0.05, pz, width, 0.085, len / n - 0.05,
          [WOOD[0] * sh, WOOD[1] * sh, WOOD[2] * sh], yaw);
  }
  // side beams + posts
  const nx = Math.cos(yaw), nz = -Math.sin(yaw);
  for (let i = 0; i <= Math.floor(len / 2.1); i++) {
    const t = Math.min(1, (i * 2.1) / len);
    const px = x0 + dx * t, pz = z0 + dz * t;
    for (const side of [-1, 1]) {
      const ox = px + nx * (width * 0.5 + 0.05) * side;
      const oz = pz + nz * (width * 0.5 + 0.05) * side;
      const gy = terrainAt(ox, oz) - 0.35;
      g.tube([ox, DECK_Y - 0.08, oz], [ox, gy, oz], 0.062, 0.055, 6, WOOD_D);
      g.box(ox, DECK_Y + 0.04, oz, 0.13, 0.07, 0.13, WOOD_L, yaw);
    }
  }
  for (const side of [-1, 1]) {
    const ox = nx * (width * 0.5 - 0.05) * side, oz = nz * (width * 0.5 - 0.05) * side;
    g.box(x0 + dx * 0.5 + ox, DECK_Y - 0.12, z0 + dz * 0.5 + oz, 0.08, 0.10, len, WOOD_D, yaw);
  }
}

function bungalow(g, cx, cz, yaw) {
  const cs = Math.cos(yaw), sn = Math.sin(yaw);
  const P = (x, z) => [cx + x * cs - z * sn, cz + x * sn + z * cs];
  const W = 3.3, D = 2.8;

  // deck planks
  const planks = 12;
  for (let i = 0; i < planks; i++) {
    const lz = -D / 2 + (i + 0.5) * (D / planks);
    const [px, pz] = P(0, lz);
    const sh = 0.84 + 0.20 * ((i * 3) % 4) / 3;
    g.box(px, DECK_Y - 0.05, pz, W, 0.085, D / planks - 0.05,
          [WOOD[0] * sh, WOOD[1] * sh, WOOD[2] * sh], yaw);
  }
  // rim
  for (const [ox, oz, sx, sz] of [[0, -D / 2, W, 0.1], [0, D / 2, W, 0.1], [-W / 2, 0, 0.1, D], [W / 2, 0, 0.1, D]]) {
    const [px, pz] = P(ox, oz);
    g.box(px, DECK_Y - 0.14, pz, sx, 0.16, sz, WOOD_D, yaw);
  }
  // stilts
  for (const [ox, oz] of [[-W / 2 + 0.2, -D / 2 + 0.2], [W / 2 - 0.2, -D / 2 + 0.2],
                          [-W / 2 + 0.2, D / 2 - 0.2], [W / 2 - 0.2, D / 2 - 0.2],
                          [0, -D / 2 + 0.2], [0, D / 2 - 0.2]]) {
    const [px, pz] = P(ox, oz);
    g.tube([px, DECK_Y - 0.14, pz], [px, terrainAt(px, pz) - 0.45, pz], 0.078, 0.066, 6, WOOD_D);
  }

  // hut
  const hw = 2.35, hd = 1.9, wh = 1.24;
  const hy = DECK_Y + wh / 2;
  g.box(cx, hy, cz, hw, wh, hd, [0.63, 0.47, 0.33], yaw);
  for (const [ox, oz] of [[-hw / 2, -hd / 2], [hw / 2, -hd / 2], [-hw / 2, hd / 2], [hw / 2, hd / 2]]) {
    const [px, pz] = P(ox, oz);
    g.box(px, hy, pz, 0.11, wh + 0.02, 0.11, [0.40, 0.28, 0.18], yaw);
  }
  // door and windows
  {
    const [px, pz] = P(0, hd / 2 + 0.03);
    g.box(px, DECK_Y + 0.58, pz, 0.72, 1.10, 0.07, [0.20, 0.13, 0.09], yaw);
    const [qx, qz] = P(0, hd / 2 + 0.05);
    g.box(qx, DECK_Y + 0.58, qz, 0.86, 1.20, 0.03, [0.46, 0.33, 0.22], yaw);
  }
  for (const side of [-1, 1]) {
    const [px, pz] = P(side * (hw / 2 + 0.03), -0.2);
    g.box(px, DECK_Y + 0.80, pz, 0.06, 0.40, 0.78, [0.14, 0.19, 0.20], yaw);
    g.box(px + side * 0.01, DECK_Y + 0.80, pz, 0.05, 0.46, 0.86, [0.44, 0.31, 0.20], yaw);
  }
  // roof
  thatchRoof(g, cx, DECK_Y + wh, cz, 3.6, 3.0, 1.22);

  // a little ladder off the deck
  const [lx, lz] = P(-W / 2 - 0.22, 0.35);
  for (const s of [-1, 1]) g.tube([lx + s * 0.18, DECK_Y - 0.1, lz], [lx + s * 0.18, 0.02, lz], 0.035, 0.035, 5, WOOD_L);
  for (let i = 0; i < 5; i++) {
    const yy = DECK_Y - 0.16 - i * 0.22;
    g.box(lx, yy, lz, 0.44, 0.045, 0.055, WOOD_L, yaw + Math.PI / 2);
  }
}

function buildProps() {
  const g = new Geo();

  // --- boardwalk network: beach → jetty → two bungalows
  // Kept short on purpose. The first pass ran the jetty fourteen units out and
  // packed the sandbar with seven palms, which filled the middle of the frame
  // and left nothing for the water to be seen against.
  boardwalk(g, 2.2, 0.0, 9.6, 0.0, 1.05);
  boardwalk(g, 6.4, 0.0, 6.4, -1.8, 0.92);
  boardwalk(g, 9.2, 0.0, 9.2, 1.5, 0.92);
  bungalow(g, 6.4, -4.0, Math.PI);      // faces back toward the jetty
  bungalow(g, 9.6, 3.4, 0);

  // steps from the sand up onto the jetty
  for (let i = 0; i < 4; i++) {
    const x = 2.75 - i * 0.32;
    g.box(x, 0.90 - i * 0.19, 0, 0.34, 0.10, 1.05, WOOD_D, 0);
  }

  // --- palms: five, leaning out over the water so their silhouettes read
  palm(g, -1.30, 0.95, 4.30, 1.5, 11);
  palm(g, 1.05, -1.35, 3.60, 1.8, 22);
  palm(g, -2.15, -0.85, 3.10, 2.0, 33);
  palm(g, 1.45, 1.75, 2.80, 2.2, 44);
  palm(g, -0.40, -2.35, 3.90, 1.3, 55);

  // --- beach shade: four posts and a thatch cone
  {
    const cx = -1.9, cz = 2.85;
    for (const [ox, oz] of [[-0.55, -0.55], [0.55, -0.55], [-0.55, 0.55], [0.55, 0.55]]) {
      const gy = terrainAt(cx + ox, cz + oz) - 0.15;
      g.tube([cx + ox, 2.05, cz + oz], [cx + ox, gy, cz + oz], 0.05, 0.048, 5, WOOD_L);
    }
    thatchCone(g, cx, 2.18, cz, 0.95, 0.95, 0.55, 12, 1.05);
    g.box(cx, 0.62, cz, 1.0, 0.09, 0.62, [0.66, 0.52, 0.36], 0.3);
  }

  // --- rocks half in the water
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU + 0.4 + rnd() * 0.5;
    const r = 4.0 + rnd() * 1.7;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    const s = 0.22 + rnd() * 0.26;
    const gy = terrainAt(x, z);
    g.sphere(x, gy + s * 0.35, z, s, s * 0.75, s * 0.9,
             [0.34, 0.33, 0.31], 0, 6, 8, [0.46, 0.45, 0.42]);
  }

  return g.build();
}

// Critters
// ---------------------------------------------------------------------------
function buildTurtle() {
  const g = new Geo();
  const SHELL = [0.26, 0.33, 0.24], SHELL_HI = [0.42, 0.42, 0.24];
  const SKIN = [0.46, 0.52, 0.38];

  g.sphere(0, 0, 0, 0.62, 0.30, 0.82, SHELL, 0, 10, 16, SHELL_HI);
  g.sphere(0, -0.10, 0, 0.54, 0.15, 0.72, [0.74, 0.70, 0.52], 0, 6, 12);
  // plastron rim
  g.sphere(0, -0.02, 0, 0.64, 0.10, 0.84, [0.62, 0.58, 0.40], 0, 5, 14);
  // head + neck
  g.tube([0, 0.02, 0.55], [0, 0.04, 0.74], 0.135, 0.12, 8, SKIN);
  g.sphere(0, 0.05, 0.80, 0.185, 0.155, 0.22, SKIN, 0, 8, 12, [0.54, 0.58, 0.44]);
  // tail
  g.tube([0, -0.02, -0.80], [0, -0.04, -1.02], 0.06, 0.012, 5, SKIN);

  // flippers — sway carries the limb index the vs rotates around
  const limb = (cx, cz, sx, sz, yaw, idx) => {
    const c = [SKIN[0] * 0.9, SKIN[1] * 0.9, SKIN[2] * 0.9];
    g.box(cx, 0, cz, sx, 0.055, sz, c, yaw, idx);
    g.box(cx, -0.01, cz, sx * 0.94, 0.05, sz * 0.6, [SKIN[0] * 1.12, SKIN[1] * 1.12, SKIN[2] * 1.12], yaw, idx);
  };
  limb(-0.52, 0.42, 0.62, 0.26, 0.30, 1);
  limb(0.52, 0.42, 0.62, 0.26, -0.30, 2);
  limb(-0.44, -0.46, 0.42, 0.20, 0.55, 3);
  limb(0.44, -0.46, 0.42, 0.20, -0.55, 4);

  return g.build();
}

function buildManta() {
  const g = new Geo();
  // The belly was 0.78 grey, which is a white shape under clear water. Seen from
  // above through a metre of sea it read as a pale cloud, so both sides stay
  // dark and the water's own absorption does the rest.
  const TOP = [0.10, 0.12, 0.16], BELLY = [0.30, 0.34, 0.36];

  g.sphere(0, 0, 0, 0.30, 0.13, 0.60, TOP, 0, 8, 14, TOP);
  g.sphere(0, -0.02, 0, 0.27, 0.10, 0.55, BELLY, 0, 6, 12);

  // wings: a swept ribbon per side, sway = normalised span for the flap
  for (const sgn of [-1, 1]) {
    const N = 6;
    let prev = null;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const x = sgn * (0.24 + t * 1.22);
      const zLead = 0.60 - 0.34 * t * t;
      const zTrail = -0.60 + 0.50 * t * t;
      const th = 0.075 * (1 - t * 0.7);
      const L = [x, th, zLead], B = [x, -th * 0.5, zLead];
      const L2 = [x, th, zTrail], B2 = [x, -th * 0.5, zTrail];
      if (prev) {
        g.quad(prev.L, L, L2, prev.L2, TOP, t);
        g.quad(prev.B, prev.B2, B2, B, BELLY, t);
      }
      prev = { L, B, L2, B2 };
    }
  }
  // cephalic horns and tail
  for (const s of [-1, 1]) g.box(s * 0.13, 0, 0.62, 0.07, 0.06, 0.22, TOP, s * 0.2);
  g.tube([0, 0, -0.58], [0, -0.02, -1.62], 0.045, 0.008, 5, TOP);

  return g.build();
}
