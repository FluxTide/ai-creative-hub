const WGSL_COMMON = /* wgsl */`
struct Frame {
  viewProj : mat4x4f,
  view     : mat4x4f,
  camPos   : vec4f,   // xyz eye, w time
  sunDir   : vec4f,   // xyz direction to sun, w intensity
  sunCol   : vec4f,
  skyTop   : vec4f,
  skyHor   : vec4f,
  amb      : vec4f,
  water    : vec4f,   // x tide, y waveEnergy, z seaLevel, w rippleAmp
  grid     : vec4f,   // x nx, y nz, z worldSize, w 1/cell
  misc     : vec4f,   // x fog, y caustic, z night, w timeOfDay
  camRight : vec4f,
  camUp    : vec4f,
  camFwd   : vec4f,
  peb      : array<vec4f, 8>,  // x, z, age, strength
  pebInfo  : vec4f,   // x count, y tan(fov/2), z aspect
  fog      : vec4f,   // rgb haze colour, w reserved
};

const PI = 3.14159265;

fn hash21(p : vec2f) -> f32 {
  var q = fract(p * vec2f(123.34, 456.21));
  q = q + dot(q, q + 45.32);
  return fract(q.x * q.y);
}

fn hash31(p : vec3f) -> f32 {
  var q = fract(p * 0.1031);
  q = q + dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

fn vnoise(p : vec2f) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  let a = hash21(i);
  let b = hash21(i + vec2f(1.0, 0.0));
  let c = hash21(i + vec2f(0.0, 1.0));
  let d = hash21(i + vec2f(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

fn fbm(p : vec2f) -> f32 {
  var s = 0.0;
  var amp = 0.5;
  var q = p;
  for (var i = 0; i < 5; i = i + 1) {
    s = s + amp * vnoise(q);
    q = q * 2.03;
    amp = amp * 0.5;
  }
  return s;
}

// Mirror of the JS terrain function — the sand, wet sand and depth all agree.
fn terrainY(x : f32, z : f32) -> f32 {
  let th = atan2(z, x);
  let rr = length(vec2f(x, z)) * (1.0 + 0.10 * sin(3.0 * th + 1.1)
              + 0.055 * sin(5.0 * th - 0.6) + 0.03 * sin(8.0 * th + 2.3));
  // The shelf is the whole point of the picture. A sandbar that drops to -0.35
  // by rr=5 leaves a one-and-a-half-unit ring of pale water and then goes
  // straight to navy, which is a pond, not a lagoon. This slope keeps the floor
  // between the waterline and a metre of depth for nearly four units, and that
  // wide shallow apron is what produces the turquoise-to-navy gradient.
  var y = 0.95 - 0.055 * rr;
  y = mix(y, -0.10, smoothstep(3.4, 6.2, rr));
  y = mix(y, -0.95, smoothstep(6.2, 9.0, rr));
  y = mix(y, -2.40, smoothstep(9.0, 15.0, rr));
  y = mix(y, -5.20, smoothstep(15.0, 28.0, rr));
  y = y + 0.05 * sin(rr * 3.4 + th * 2.0) * smoothstep(1.5, 4.0, rr) * (1.0 - smoothstep(6.0, 12.0, rr));
  return y;
}

fn rotY(p : vec3f, a : f32) -> vec3f {
  let c = cos(a); let s = sin(a);
  return vec3f(p.x * c + p.z * s, p.y, -p.x * s + p.z * c);
}

fn skyCol(dir : vec3f) -> vec3f {
  let up = clamp(dir.y, 0.0, 1.0);
  // the camera only ever sees a narrow strip just above the horizon, so the
  // zenith colour has to arrive early in the gradient to read as sky — but a
  // 14th-power falloff arrived so fast that everything below the top sliver
  // collapsed into one flat colour, which read as a grey wall.
  //
  // Both of those were wrong for the same reason: the exponent was chosen
  // against the whole dome while the shutter only opens on the first eight
  // degrees. pow(1 - y, 6) still returns 0.38 at the top of that strip, so the
  // visible sky was 38 percent horizon everywhere it was not 100 percent, which
  // is a slab. Normalise over the strip instead, so the gradient spans exactly
  // the band the eye is given.
  // Measured, not guessed. cam.fov is 0.72 rad and the camera looks 14 degrees
  // down at the sandbar, so the top edge of the frame sits 6.6 degrees above the
  // horizon and the bottom of the sky meets it at zero: the entire visible sky
  // is dir.y from 0 to about 0.115 and nothing beyond. Earlier attempts divided
  // by 0.05 and then by 0.03, both of which sit inside that range, so everything
  // above them pinned to the top colour and the sky came out as a slab again.
  // Span the measured width exactly.
  let g = pow(1.0 - clamp(up / 0.115, 0.0, 1.0), 1.5);
  var c = mix(U.skyTop.rgb, U.skyHor.rgb, g);

  // A narrow warm band right on the horizon used to sit here and it was the
  // reason for the hard seam: everything above the waterline returned the warm
  // horizon colour while everything below returned the cold haze, so the two
  // met in a razor-sharp line across the frame. Atmosphere does not work that
  // way. Merge both into the haze over a band that spans the horizon, so the
  // pink peels off gradually and lands on the same colour the sea fades into.
  // The camera sits fourteen degrees up, so everything it can see of the sky is
  // an eight-degree sliver: dir.y runs from 0 to about 0.15 and no further. A
  // decay of exp(-5y) is still 0.5 at the top of that sliver, so the haze
  // covered the whole sky evenly and it rendered as one flat orange slab with no
  // gradient in it at all. The decay has to die inside the sliver, not above it.
  //
  // Capped below one as well. At full strength this band became exactly the
  // colour distant water fades to, so sky and sea met at the same value and the
  // horizon line disappeared — the sea looked like a brown floor continuing the
  // sky. Stopping short leaves the sky a touch brighter than the water it meets,
  // which is what actually draws a horizon.
  // Weak on purpose. Strong enough to warm the last few degrees above the water
  // and no stronger: at 0.72 the band was as strong as the horizon itself, so
  // the whole sky took one value and the gradient vanished.
  let band = exp(-max(dir.y, 0.0) * 30.0) * 0.34;
  c = mix(c, U.fog.rgb, band);

  let sd = max(dot(normalize(dir), normalize(U.sunDir.xyz)), 0.0);
  // A ninth-power glow lit the entire visible strip at golden hour, because the
  // sun sits only twenty degrees off the view axis and the strip spans four. The
  // warm wash drowned the strip's own blue and left a flat brown field. A tight
  // lobe puts the sun's bloom where the sun is and leaves the rest of the sky to
  // its gradient. Its strength is now per-preset (Frame.misc.w) instead of a
  // constant: an eleven-degree strip is small enough that a glow tuned against
  // the whole dome turns it into a warm slab.
  c = c + U.sunCol.rgb * pow(sd, 26.0) * U.misc.w * U.sunDir.w;

  // a high, sparse cloud deck. it only lives well above the horizon: a low
  // camera reflects almost-horizontal rays, and clouds there turn the whole
  // sea white.
  //
  // A cloud deck projected onto a plane (dir.xz / dir.y) cannot work in this
  // shot: the camera sits a few metres above the sea, so the whole visible sky
  // is a thin band where dir.y is barely above zero. Dividing by it sends the
  // sample coordinate to infinity right where the band is, the noise ends up
  // finer than a pixel, and whatever threshold gates the deck becomes a ruled
  // line across the frame — the same line the old "if (dir.y > 0.30)" drew, just
  // at a different height.
  //
  // Drive the noise from the unit direction's own components instead. They never
  // go singular, the frequency stays constant across the whole band, and the
  // veil can fade in on a smoothstep that nobody can point at.
  // Finer than the first attempt: at 1.7 across the whole visible strip one blob
  // covered a third of the sky, which is a storm bank, not a tropical afternoon.
  //
  // The visible sky is only dir.y 0 to 0.115 — a 41 degree wedge above the
  // horizon. Any cloud field has to be sampled in the plane of that wedge: one
  // axis across the screen (the azimuth), one up it (elevation). Both earlier
  // attempts fed the noise the xz unit vector, which is a function of the azimuth
  // alone, so every column of pixels carried a single value and the deck drew as
  // another horizontal rule no matter where the threshold was put.
  let azim = atan2(dir.x, dir.z);
  let drift = U.camPos.w * 0.006;
  let broad = fbm(vec2f(azim * 4.2 + drift, dir.y * 15.0));
  let detail = fbm(vec2f(azim * 12.5 - drift * 1.4, dir.y * 38.0 + 9.0));
  let lump = broad * 0.68 + detail * 0.32;
  // A gate with real gaps: below it the sky stays blue, above it the puff is
  // solid, and because lump varies along both axes the gaps are holes rather
  // than a band.
  let mass = smoothstep(0.47, 0.61, lump);
  // Soft at both ends of the strip so no edge is ever a line: the base melts
  // into the horizon haze and the top thins out before the frame closes.
  let baseFade = smoothstep(0.007, 0.032, dir.y);
  let topFade = 1.0 - smoothstep(0.058, 0.113, dir.y);
  let cover = mass * baseFade * topFade;
  // Cloud is the brightest thing in a daylight sky, so it is built up from the
  // horizon colour rather than from a grey: a grey mix was what made the first
  // attempt read as a dirty smudge.
  let lit = U.skyHor.rgb * 1.50 + U.sunCol.rgb * 0.30;
  // Almost nothing at night: an ungated deck glowed above the dark sea and the
  // bioluminescence below lost its contrast.
  c = mix(c, lit, cover * mix(0.70, 0.10, U.misc.z));

  if (U.misc.z > 0.25) {
    // Every number in this block was scaled for a sky the camera never sees. The
    // visible sky is only dir.y 0 to 0.115 (see skyCol), so a coarse lattice put a
    // few dozen stars on the whole frame and the fade-in at 0.35 dimmed most of
    // those to a third. Sized against the real band now.
    //
    // The lattice is in direction space, where one cell here spans about five
    // pixels. Lighting the whole cell — which is what a bare step() does — draws
    // squares, and at seven pixels they read as a broken display rather than a sky,
    // so each cell carries one soft disc near its own centre instead.
    let sp = dir * 260.0;
    let cell = floor(sp);
    let r = hash31(cell);
    let mag = 0.45 + 0.55 * hash31(cell + vec3f(17.0));
    let off = fract(sp) - vec3f(0.5);
    let disc = 1.0 - smoothstep(0.04, 0.34 * mag, length(off));
    let tw = 0.70 + 0.30 * sin(U.camPos.w * 1.7 + r * 90.0);
    // only the darkest presets get stars; a faint dawn must not turn dotted
    let vis = smoothstep(0.25, 0.75, U.misc.z);
    let star = step(0.962, r) * disc * mag * tw * smoothstep(0.002, 0.030, dir.y) * vis;
    c = c + vec3f(star, star, star * 1.15) * U.misc.z * 1.6;
    // The galactic band was centred at dir.y = 0.42 — three times the top of the
    // frame, so it had never been drawn once. Centred inside the visible band now,
    // and narrowed to match: at the old width it would have filled the whole sky.
    let band = exp(-pow((dir.y - 0.062 + 0.030 * sin(dir.x * 2.2)) * 26.0, 2.0));
    c = c + vec3f(0.10, 0.12, 0.22) * band * U.misc.z * 0.55;
  }
  return c;
}

// Reflection lookup for the water. The full skyCol() carries a cloud deck, and at
// this scale a reflected cloud reads as a blown-out white blob sliding over the
// lagoon. The surface only samples gradient, haze and the sun's own glow.
fn skyRefl(dir : vec3f) -> vec3f {
  let up = clamp(dir.y, 0.0, 1.0);
  // 4th power, not 14th. A grazing reflection is not a thin slice of horizon: on
  // real water it picks up a good part of the sky dome, and with the 14th power
  // the mid-field returned the horizon's warm grey for every angle, which is
  // what flattened two thirds of the lagoon into one tone.
  // NOT the visible-sky width used upstream. A reflection ray leaves the surface
  // at twice the camera's depression, so every water pixel on screen samples
  // dir.y between roughly 0.1 and 0.3 — the whole surface sat above the sky's
  // 0.115 cut, clamped to the top colour, and the lagoon came back as one mauve
  // sheet. Physical: grazing water mirrors the warm band a dozen degrees above
  // the horizon, not the zenith. Span that band instead.
  let g = pow(1.0 - clamp(up / 0.55, 0.0, 1.0), 1.2);
  var c = mix(U.skyTop.rgb, U.skyHor.rgb, g);
  // Same haze band as the sky above, so the water's reflection at grazing angles
  // picks up the atmospbere it is actually sitting under instead of the warm
  // horizon ring. Without it the whole middle distance turned peach-grey.
  // Reflection off water at fourteen degrees returns the sky at fourteen degrees
  // — higher than anything the camera can see, and therefore the coldest part of
  // the gradient. A decay of exp(-26 up) died within two degrees, so the surface
  // mirrored the raw zenith colour while the sky above it was still warm, and at
  // golden hour the lagoon came back violet. The atmosphere is thickest right at
  // the horizon; let the reflection sample that band.
  //
  // The weight is per-hour. A horizon that is warm means the air over the water
  // is dusty and warm, so a grazing reflection should pick more of it up; at
  // noon the same lift would only darken a lagoon that already reads right.
  // Yellow excess, not red excess. A pink dawn and an amber sunset are almost
  // identical in red-over-blue (0.365 against 0.370), so the old test handed
  // both hours the same copper treatment and dawn lost its turquoise entirely.
  // What separates them is green sitting above blue: pink light is red plus
  // blue with green left behind, amber light is red plus green with blue left
  // behind. On the horizon that is 0.045 for dawn against 0.140 for golden hour.
  // A pink sky therefore no longer converts the lagoon to bronze.
  let warmR = clamp((U.skyHor.g - U.skyHor.b) * 7.0, 0.0, 1.0);
  let haze = exp(-up * 2.5) * mix(0.55, 0.92, warmR);
  // Land on the exact colour fogMix fades distant water into. The gradient above
  // the waterline and the water below it must meet at one value, or the seam
  // between them is a straight ruled line across the whole frame.
  // A mirror returns the sky's luminance, and the sky here is far brighter than
  // the water under it. At full strength that turned the whole middle distance
  // into pale grey sheen with no turquoise left in it — a lagoon at this angle
  // reflects about half of what a mirror would.
  //
  // This has to happen BEFORE the haze mix. Applied after, it darkened the haze
  // too, so a horizontal reflection came back 42% darker than the sky right
  // above it and the horizon turned into a ruled line between two flat colours.
  // This used to be c * 0.58, and that single constant was the grey-violet
  // film over the middle distance at golden hour. It was added back when the
  // reflection carried two sun lobes and every sunlit patch came back white; the
  // lobes are gone and the normal no longer jitters, so all the multiplier did
  // now was make the sea 42% darker than the sky directly above it — every hour,
  // but only visible when the sky is warm and the water is not.
  c = mix(c, U.fog.rgb, haze);
  // No sun term here, and that is deliberate.
  //
  // This function used to add two sun lobes on top of the sky gradient, and they
  // were the peach bloom that sat over the right-hand lagoon for so long. The
  // reason is that this lookup cannot see the water's real normal: out past
  // sixteen metres the reflection normal has been flattened to straight up (see
  // fsWater), so the reflected direction here is the view direction mirrored by
  // a horizontal plane — one constant for a whole stretch of water. A 1200-power
  // lobe does not resolve that stretch into a highlight: it either misses it or
  // fires across all of it, and the result is a stationary soft blob with no
  // structure at all, which the eye reads as dirt on the lens.
  //
  // The sun's image on water belongs to the glitter term in fsWater, which has
  // the real per-pixel normal and therefore a highlight with an actual shape.
  // A sky lookup returns sky, nothing else.
  return c;
}

fn causticPattern(p : vec2f) -> f32 {
  let t = U.camPos.w * 0.55;
  // 1.75 put one caustic cell at about two metres, which at camera distance is
  // a blob a hundred pixels wide — with the high exponent it read as weed, not
  // as light. Doubling the spatial frequency puts the cells below a metre so
  // they resolve as filaments.
  let q = p * 3.6;
  var c = 0.0;
  c = c + sin(q.x * 1.7 + t * 1.1 + sin(q.y * 1.3 - t * 0.8) * 1.7);
  c = c + sin(q.y * 1.9 - t * 1.3 + sin(q.x * 1.1 + t * 0.7) * 1.5);
  c = c + sin((q.x + q.y) * 1.2 + t * 0.9);
  let v = 0.5 + 0.1667 * c;
  // a high exponent keeps only the thin caustic filaments; the old 3.0 power
  // left broad blobs that clipped to white once seen through shallow water
  return pow(clamp(v, 0.0, 1.0), 7.5) * 2.6;
}

fn tonemap(c : vec3f) -> vec3f {
  var x = max(c, vec3f(0.0)) * 0.88;
  x = (x * (2.35 * x + 0.025)) / (x * (2.45 * x + 0.58) + 0.115);
  // a touch of filmic contrast so the pastel palette keeps its depth
  x = clamp(x, vec3f(0.0), vec3f(1.0));
  x = mix(x, x * x * (3.0 - 2.0 * x), 0.22);
  return pow(clamp(x, vec3f(0.0), vec3f(1.0)), vec3f(1.0 / 2.2));
}

fn fogMix(c : vec3f, wp : vec3f) -> vec3f {
  let d = length(wp - U.camPos.xyz);
  // A haze that rises slowly and then steeply: a linear ramp put a uniform
  // veil over the whole lagoon, while this curve leaves the foreground alone
  // and only swallows what is genuinely far away.
  // 70 was far too close for a 64 metre world seen from 30 metres out: the
  // readable middle of the lagoon — the strip that carries the wave structure —
  // was already half-dissolved into haze, so every hour read as a flat plate of
  // colour with the island sitting on it. Measured at golden hour, the mid-field
  // came back rgb(133,134,124): R, G and B within ten of each other, which is
  // the eye's definition of grey. The haze was averaging an orange sky with a
  // turquoise body over the one part of the frame that should be showing both.
  // Start it past the composition instead, and let the fade do its work on the
  // genuinely distant rim only.
  let f = 1.0 - exp(-pow(max(d - 104.0, 0.0) * U.misc.x, 4.0));
  // What the haze fades INTO must be the sky that is actually standing over
  // that direction, not a fixed fog colour. This is the whole reason there used
  // to be a ruled line across the frame: fogging to a flat grey-violet while the
  // sky right above the same spot was still carrying the sun's glow means the
  // water and the sky can never meet, at any distance. Asking skyCol for the
  // horizon colour along this bearing makes the two agree by construction — every
  // preset, every sun angle, including the peach glow that only exists near the
  // sun's bearing.
  let toCam = wp - U.camPos.xyz;
  let hdir = normalize(vec3f(toCam.x, 0.0, toCam.z) + vec3f(1e-4, 0.0, 1e-4));
  return mix(c, tonemap(skyCol(hdir)), clamp(f, 0.0, 0.99));
}
`;

const WGSL_BASE = /* wgsl */`
@group(0) @binding(0) var<uniform> U : Frame;
@group(0) @binding(1) var<storage, read_write> dstH : array<f32>;

@compute @workgroup_size(8, 8)
fn csBase(@builtin(global_invocation_id) gid : vec3u) {
  let n = vec2u(u32(U.grid.x), u32(U.grid.y));
  if (gid.x >= n.x || gid.y >= n.y) { return; }
  let S = U.grid.z;
  let p = (vec2f(f32(gid.x), f32(gid.y)) + vec2f(0.5)) / vec2f(f32(n.x), f32(n.y)) * S - vec2f(S * 0.5);
  let t = U.camPos.w;
  let amp = U.water.y;

  var h = 0.0;
  // Three swell trains, longest 6.2 units and shortest 2.8. A fourth at 1.9 was
  // there before and it was the visible problem: the water mesh carries rings
  // about a third of a unit apart, so a 1.9-unit wave only gets five samples per
  // period, and five samples of a sine drawn on a polar grid is a moire. Every
  // wavelength here has at least eight rings under it.
  //
  // These used to add up to 0.37, and that was the corduroy. A lagoon behind a
  // reef is nearly flat; three sine trains at that height, seen across a polar
  // mesh from fourteen degrees up, line up into ridges that run the width of the
  // frame and never break. The swell is now a third of what it was, and the
  // noise below carries the surface instead: noise has no direction, so it
  // cannot line up into ridges from any camera angle.
  h = h + sin(dot(p, vec2f(0.62, 0.34)) * 1.02 + t * 0.85) * 0.075;
  h = h + sin(dot(p, vec2f(-0.40, 0.71)) * 1.48 + t * 1.20) * 0.042;
  h = h + sin(dot(p, vec2f(0.83, -0.55)) * 2.24 + t * 1.70) * 0.020;
  // a slow swell envelope so the sea breathes
  h = h * (0.85 + 0.15 * sin(t * 0.21 + p.x * 0.05));

  // Chop is a ripple, not a hill, and it has to be coarser than the mesh that
  // carries it. The vertex rings sit about a third of a unit apart near the
  // island and the water shader samples this field analytically, so anything
  // shorter than two or three rings per wavelength gets undersampled by the
  // geometry and shows up as concentric corrugations. Wavelengths of 4 and 2
  // units stay well inside what the mesh can hold.
  let chop = vnoise(p * 1.55 + vec2f(t * 0.20, -t * 0.14)) - 0.5;
  let chop2 = vnoise(p * 3.05 - vec2f(t * 0.30, t * 0.22)) - 0.5;
  // Now the dominant term. Its wavelengths (4 and 2 units) still sit well inside
  // what the mesh resolves, and because it is noise the crests never align.
  h = h + (chop * 0.115 + chop2 * 0.050) * amp;

  let dep = U.water.z - terrainY(p.x, p.y);
  let damp = clamp((dep - 0.04) * 0.85, 0.0, 1.0);
  // fade to flat calm before the height field runs out at the grid edge
  let fade = 1.0 - smoothstep(26.0, 31.0, length(p));
  dstH[gid.y * n.x + gid.x] = h * amp * (0.35 + 0.65 * damp) * fade;
}
`;

const WGSL_RIPPLE = /* wgsl */`
@group(0) @binding(0) var<uniform> U : Frame;
@group(0) @binding(1) var<storage, read> srcR : array<vec2f>;
@group(0) @binding(2) var<storage, read_write> dstR : array<vec2f>;

@compute @workgroup_size(8, 8)
fn csRipple(@builtin(global_invocation_id) gid : vec3u) {
  let n = vec2u(u32(U.grid.x), u32(U.grid.y));
  if (gid.x >= n.x || gid.y >= n.y) { return; }
  let nx = i32(n.x);
  let ny = i32(n.y);
  let ix = i32(gid.x);
  let iy = i32(gid.y);
  let S = U.grid.z;
  let p = (vec2f(f32(gid.x), f32(gid.y)) + vec2f(0.5)) / vec2f(f32(n.x), f32(n.y)) * S - vec2f(S * 0.5);

  let i = iy * nx + ix;
  let cur = srcR[i];
  let xm = max(ix - 1, 0);
  let xp = min(ix + 1, nx - 1);
  let ym = max(iy - 1, 0);
  let yp = min(iy + 1, ny - 1);
  let sum = srcR[iy * nx + xm].x + srcR[iy * nx + xp].x
          + srcR[ym * nx + ix].x + srcR[yp * nx + ix].x;

  let lap = sum - 4.0 * cur.x;
  // Wave speed is sqrt(k) cells per step. At GRID=288 over WORLD=96 one cell is
  // a third of a unit and this build averages ~60 steps a second, so 0.1 walks
  // about two world units a second: fast enough to answer a click, slow enough
  // that the ring is still travelling when the eye gets to it.
  var v = (cur.x - cur.y) * 0.9988 + lap * 0.0100;

  // pebbles land over their first ~90 ms
  // this has to run before h is integrated: a kick applied to the velocity
  // after h = cur.x + v is simply thrown away, and the ripple never exists
  for (var j = 0; j < 8; j = j + 1) {
    if (f32(j) >= U.pebInfo.x) { break; }
    let pb = U.peb[j];
    if (pb.z < 0.0 || pb.z > 0.085) { continue; }
    let d = distance(p, pb.xy);
    // A near-point source: the narrower the kick, the shorter the wavelength it
    // launches, and a short wave reads as a crisp ring instead of a slow bulge.
    // One unit is three cells, the finest the grid can carry and still
    // interpolate smoothly. The strength is small because the ring is seen as
    // foam and slope: a kick strong enough to dent the surface visibly spikes
    // the centre into a cone.
    // Push a ring, not a pit. A centre-weighted kick (the earlier
    // 1 - smoothstep(0, r, d)) leaves a dent that outlives the wave: the basin
    // reflects the dark zenith for seconds and the drop reads as a hole. A
    // Gaussian around d = 0.9 leaves the centre untouched, so what travels out
    // is a crest with a trough behind it, which is what a stone does to water.
    // A near-point source, but only as narrow as the mesh can carry. The kick
    // is added to velocity on each of the ~5 frames inside the 85 ms window, so
    // it integrates: 0.30 used to stack to roughly 1.5 units of height and slam
    // into the +/-2 clamp, flattening the crest into faceted plateaus. 0.06
    // peaks well under the clamp.
    // Source width is not free: the water mesh's rings sit about 0.33 units
    // apart at the lagoon's radius, so a disturbance narrow enough to launch a
    // 0.8-unit wavelength lands barely two samples per wave — right at the
    // Nyquist limit, where the mesh stops reproducing the wave and starts
    // aliasing it into faceted plates. A source roughly 0.8 units wide launches
    // a wavelength of about 1.4 units, four or five mesh samples, which the
    // surface can actually carry. The visual ring the eye follows is drawn
    // analytically in fsWater, so the physical wave only has to give the water
    // genuine relief under it, not be the ring itself.
    let ringKick = exp(-pow((d - 0.90) * 1.30, 2.0));
    v = v - ringKick * pb.w * (1.0 - pb.z / 0.085) * 0.06;
  }

  var h = cur.x + v;

  let edge = min(min(f32(ix), f32(nx - 1 - ix)), min(f32(iy), f32(ny - 1 - iy)));
  if (edge < 6.0) { h = h * 0.955; v = v * 0.955; }

  dstR[i] = vec2f(clamp(h, -2.0, 2.0), cur.x);
}
`;

const WGSL_SKY = /* wgsl */`
@group(0) @binding(0) var<uniform> U : Frame;

struct SV { @builtin(position) pos : vec4f, @location(0) ndc : vec2f };

@vertex
fn vsSky(@builtin(vertex_index) vi : u32) -> SV {
  var o : SV;
  let x = f32((vi << 1u) & 2u) * 2.0 - 1.0;
  let y = f32(vi & 2u) * 2.0 - 1.0;
  o.pos = vec4f(x, y, 0.0, 1.0);
  o.ndc = vec2f(x, y);
  return o;
}

@fragment
fn fsSky(in : SV) -> @location(0) vec4f {
  // rebuild the eye ray from the camera basis passed in explicitly
  let half = U.pebInfo.y;
  let aspect = U.pebInfo.z;
  let dir = normalize(U.camFwd.xyz
            + U.camRight.xyz * (in.ndc.x * half * aspect)
            + U.camUp.xyz * (in.ndc.y * half));
  return vec4f(tonemap(skyCol(dir)), 1.0);
}
`;

const WGSL_TERRAIN = /* wgsl */`
@group(0) @binding(0) var<uniform> U : Frame;

struct TO { @builtin(position) pos : vec4f, @location(0) wp : vec3f, @location(1) nrm : vec3f };

@vertex
fn vsTerrain(@location(0) p : vec3f) -> TO {
  var o : TO;
  let e = 0.18;
  let hL = terrainY(p.x - e, p.z);
  let hR = terrainY(p.x + e, p.z);
  let hD = terrainY(p.x, p.z - e);
  let hU = terrainY(p.x, p.z + e);
  let n = normalize(vec3f(-(hR - hL) / (2.0 * e), 1.0, -(hU - hD) / (2.0 * e)));
  o.wp = vec3f(p.x, terrainY(p.x, p.z), p.z);
  o.nrm = n;
  o.pos = U.viewProj * vec4f(o.wp, 1.0);
  return o;
}

@fragment
fn fsTerrain(in : TO) -> @location(0) vec4f {
  let wp = in.wp;
  let sea = U.water.z;
  let above = wp.y - sea;
  let n = normalize(in.nrm);

  // Sand is never the brightest thing in a lagoon at this hour — the sky is.
  // At 0.90 these values already sat at the top of the tonemap curve before a
  // single light was applied, so the sandbar came out as a flat white cut-out
  // with no slope and no grain. Start it low and let the sun lift it.
  // Coral sand, not river silt. The old values were a mid brown with almost no
  // blue in them, and under a nine-degree sun they turned the sandbar into wet
  // clay. Coral sand is close to white: it is shell and coral rubble, and that
  // high albedo is exactly why the lagoon around it glows.
  let dry  = vec3f(0.820, 0.775, 0.645);
  let wet  = vec3f(0.520, 0.480, 0.395);
  let deep = vec3f(0.360, 0.340, 0.280);
  var base = mix(wet, dry, smoothstep(0.02, 0.55, above));
  base = mix(base, deep, smoothstep(1.15, 3.0, wp.y));
  // grain, plus long shallow ripples combed across the beach so the sand reads
  // as a surface with a direction instead of a blank patch
  let gr = vnoise(wp.xz * 26.0) * 0.10 + vnoise(wp.xz * 6.0) * 0.09;
  let ripple = sin(wp.x * 2.1 + wp.z * 0.7 + vnoise(wp.xz * 1.6) * 2.4) * 0.5 + 0.5;
  base = base * (0.90 + gr) * (0.955 + 0.045 * ripple);

  let L = normalize(U.sunDir.xyz);
  let ndl = clamp(dot(n, L), 0.0, 1.0);
  var col = base * (U.amb.rgb * (0.55 + 0.45 * n.y) + U.sunCol.rgb * ndl * U.sunDir.w);
  // bounce from bright sand
  col = col + base * vec3f(0.10, 0.30, 0.34) * clamp(ndl, 0.0, 1.0) * 0.35;

  if (above < 0.0) {
    let dep = clamp(-above, 0.0, 6.0);
    // At five degrees the sun is a sliver, and nearly all of it reflects off the
    // surface instead of entering the water, so only a fraction of it ever
    // reaches the sand. Faking caustics at full strength while the lagoon above
    // sits in dusk is what put the pale diagonal filaments across the
    // foreground: a brightly lit floor under dark water reads as frost on the
    // glass, and no amount of tinting the water fixes that. Gate on the sun's
    // elevation rather than on the preset's caustic weight — the weight is an
    // artistic dial, this is the transmittance.
    let sunIn = smoothstep(0.0, 0.42, L.y);
    let caus = causticPattern(wp.xz + n.xz * 0.4) * U.misc.y * sunIn;
    // The sand is not a deep-sea red filter. At 1.15 per metre the red channel
    // was below a fifth by two metres, so every metre of the lagoon floor read
    // the same cold teal and the crystal water above it had nothing to show:
    // the near field became a flat slab of colour. Maldives sand under two
    // metres of lagoon still reads as sand, tinted — that is the whole appeal of
    // the place. Absorb gently here and let the water surface do the tinting.
    col = col * exp(-vec3f(0.30, 0.075, 0.055) * dep * 0.55);
    // Caustics are the signature of this water, not a garnish. At 1.15 decay
    // and 0.30 weight they were gone within a metre and a half, which is
    // exactly the band the camera is looking at, so the floor was unlit and
    // untextured everywhere it could be seen.
    //
    // But the tint cannot be (0.55, 1.0, 0.92) multiplied by the sand: a warm
    // sand colour times a cyan filter is green, and at 0.62 weight the near
    // field turned into mats of algae. Caustics add sunlight, so they should
    // brighten the sand they land on, not recolour it — near-white tint, and a
    // weight that lights the floor without painting it.
    col = col + base * vec3f(0.92, 1.0, 0.96) * caus * exp(-dep * 0.55) * 0.45;
  }
  // damp line right at the waterline
  let line = exp(-abs(above) * 26.0);
  col = mix(col, base * 0.72, line * 0.5);
  // speckle foam left on the sand
  let foam = smoothstep(0.55, 1.0, vnoise(wp.xz * 3.2 + vec2f(U.camPos.w * 0.15, 0.0)));
  col = mix(col, vec3f(0.62, 0.68, 0.65), foam * line * 0.72);
  // Moonlight is not a stage light. The night preset's sun is a real light with
  // a real intensity, so coral sand — the highest-albedo surface in the scene —
  // came back at nearly daylight brightness while the sky behind it went black.
  // The eye reads that pairing as a spotlight aimed at the island, complete with
  // a glow where the white sand meets the dark water. Sand at night is a pale
  // shape, not a lit one: halve it and let the moon only suggest the form.
  // Dark is not the same as desaturated. A neutral 0.46 multiplied every channel
  // equally and left the coral sand reading as one grey concrete slab; moonlight
  // is blue, so the discount leans blue and keeps a little of the sand's warmth.
  col = col * mix(vec3f(1.0), vec3f(0.52, 0.56, 0.68), U.misc.z);

  return vec4f(tonemap(fogMix(col, wp)), 1.0);
}
`;

const WGSL_PROPS = /* wgsl */`
@group(0) @binding(0) var<uniform> U : Frame;

struct PO {
  @builtin(position) pos : vec4f,
  @location(0) wp : vec3f,
  @location(1) nrm : vec3f,
  @location(2) col : vec3f,
  @location(3) sway : f32,
};

@vertex
fn vsProps(@location(0) p : vec3f, @location(1) n : vec3f,
           @location(2) c : vec3f, @location(3) s : f32) -> PO {
  var o : PO;
  let t = U.camPos.w;
  let breeze = 0.30 + 0.70 * U.water.y;
  let w = s * s;
  let off = vec3f(sin(t * 1.55 + p.x * 0.55 + p.z * 0.3) * 0.115,
                  sin(t * 2.1 + p.z * 0.7) * 0.035,
                  cos(t * 1.35 + p.z * 0.45) * 0.095) * w * breeze;
  let wp = p + off;
  o.wp = wp;
  o.nrm = normalize(n);
  o.col = c;
  o.sway = s;
  o.pos = U.viewProj * vec4f(wp, 1.0);
  return o;
}

@fragment
fn fsProps(in : PO) -> @location(0) vec4f {
  let L = normalize(U.sunDir.xyz);
  let V = normalize(U.camPos.xyz - in.wp);
  var n = normalize(in.nrm);
  if (dot(n, V) < 0.0) { n = -n; }

  let ndl = clamp(dot(n, L), 0.0, 1.0);
  let hemi = 0.5 + 0.5 * n.y;
  var col = in.col * (U.amb.rgb * (0.42 + 0.62 * hemi) + U.sunCol.rgb * ndl * U.sunDir.w);

  // warm bounce off the water for anything near the surface
  // The tint was strongly cyan, and at noon it was the only thing lifting the
  // shadow side: every wall under the bungalows came back teal-grey. What
  // actually bounces up onto a hut standing over a lagoon is mostly light off
  // the white sand, which is near-neutral with a slight warm cast; keeping the
  // cyan at a quarter of the weight reads as bounced water without repainting
  // the woodwork.
  let lift = clamp(1.0 - (in.wp.y - U.water.z) * 0.55, 0.0, 1.0);
  col = col + in.col * mix(vec3f(0.30, 0.28, 0.24), vec3f(0.10, 0.28, 0.30), 0.28)
            * lift * 0.30 * (0.4 + 0.6 * ndl);

  let h = normalize(L + V);
  let spec = pow(clamp(dot(n, h), 0.0, 1.0), 42.0);
  col = col + U.sunCol.rgb * spec * U.sunDir.w * 0.30;

  // backlit leaves glow
  let back = clamp(dot(-V, L) * 0.5 + 0.5, 0.0, 1.0);
  col = col + in.col * vec3f(0.30, 0.55, 0.18) * pow(back, 4.0) * in.sway * 0.35;

  let rim = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.2);
  col = col + U.amb.rgb * rim * 0.14;

  return vec4f(tonemap(fogMix(col, in.wp)), 1.0);
}
`;

const WGSL_WATER = /* wgsl */`
@group(0) @binding(0) var<uniform> U : Frame;
@group(0) @binding(1) var<storage, read> baseH : array<f32>;
@group(0) @binding(2) var<storage, read> ripH  : array<vec2f>;

struct WO {
  @builtin(position) pos : vec4f,
  @location(0) wp : vec3f,
};

fn bilinBase(p : vec2f) -> f32 {
  let n = vec2u(u32(U.grid.x), u32(U.grid.y));
  let S = U.grid.z;
  let uv = (p / S + vec2f(0.5)) * vec2f(f32(n.x), f32(n.y)) - vec2f(0.5);
  let f = fract(uv);
  let i0 = vec2i(floor(uv));
  let i1 = i0 + vec2i(1);
  let x0 = clamp(i0.x, 0, i32(n.x) - 1);
  let x1 = clamp(i1.x, 0, i32(n.x) - 1);
  let y0 = clamp(i0.y, 0, i32(n.y) - 1);
  let y1 = clamp(i1.y, 0, i32(n.y) - 1);
  let a = baseH[y0 * i32(n.x) + x0];
  let b = baseH[y0 * i32(n.x) + x1];
  let c = baseH[y1 * i32(n.x) + x0];
  let d = baseH[y1 * i32(n.x) + x1];
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

fn bilinRip(p : vec2f) -> f32 {
  let n = vec2u(u32(U.grid.x), u32(U.grid.y));
  let S = U.grid.z;
  let uv = (p / S + vec2f(0.5)) * vec2f(f32(n.x), f32(n.y)) - vec2f(0.5);
  let f = fract(uv);
  let i0 = vec2i(floor(uv));
  let i1 = i0 + vec2i(1);
  let x0 = clamp(i0.x, 0, i32(n.x) - 1);
  let x1 = clamp(i1.x, 0, i32(n.x) - 1);
  let y0 = clamp(i0.y, 0, i32(n.y) - 1);
  let y1 = clamp(i1.y, 0, i32(n.y) - 1);
  let a = ripH[y0 * i32(n.x) + x0].x;
  let b = ripH[y0 * i32(n.x) + x1].x;
  let c = ripH[y1 * i32(n.x) + x0].x;
  let d = ripH[y1 * i32(n.x) + x1].x;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

fn hAt(p : vec2f) -> f32 {
  return bilinBase(p) + bilinRip(p) * U.water.w;
}

@vertex
fn vsWater(@location(0) p : vec3f) -> WO {
  var o : WO;
  let h = hAt(p.xz);
  let wp = vec3f(p.x, U.water.z + h, p.z);
  o.wp = wp;
  o.pos = U.viewProj * vec4f(wp, 1.0);
  return o;
}

@fragment
fn fsWater(in : WO) -> @location(0) vec4f {
  let p = in.wp.xz;
  let sea = U.water.z;

  // Normal from the two height fields, each differenced at its own step.
  // The base swell is quantised to GRID cells (WORLD/GRID = 0.6 units each), so a
  // finite difference finer than one cell reads that staircase as creases and
  // paints the sun along every cell edge — it needs a wide step. A pebble ripple
  // only spans two or three cells, so that same wide step lands past half its
  // wavelength and averages it away completely; the ripple gets a short step.
  let dB = 0.50;
  let dR = 0.28;
  let gxB = (bilinBase(p + vec2f(dB, 0.0)) - bilinBase(p - vec2f(dB, 0.0))) / (2.0 * dB);
  let gzB = (bilinBase(p + vec2f(0.0, dB)) - bilinBase(p - vec2f(0.0, dB))) / (2.0 * dB);
  let gxR = (bilinRip(p + vec2f(dR, 0.0)) - bilinRip(p - vec2f(dR, 0.0))) / (2.0 * dR);
  let gzR = (bilinRip(p + vec2f(0.0, dR)) - bilinRip(p - vec2f(0.0, dR))) / (2.0 * dR);
  // A pebble ring is only a tenth of the swell's height, so at equal weight it
  // vanishes into the rolling surface. The slope is what the eye and the sun
  // both read, so weight the ripple's slope up until the circle stands out
  // against the swell behind it.
  let RS = 3.4;
  // Soft ceiling on the ripple slope. Amplifying a real displacement by 3.4
  // turned a few centimetres of water into a slope steep enough to point at the
  // dark zenith, and because the height field is quantised to 22 cm cells that
  // tilt jumped between neighbouring pixels: a faceted dark plate instead of a
  // ring. A hard clamp does not fix it — pinning every over-steep sample to the
  // same value turns the slope field into a plateau with a stair step at its
  // edge, which is the same faceting one derivative up. This compresses toward
  // the ceiling asymptotically, so the slope stays continuous and the
  // reflection is bounded to about 28 degrees off vertical.
  let ripG = vec2f(gxR, gzR) * U.water.w * RS;
  let ripSlope = ripG / (1.0 + abs(ripG) / 0.55);
  var n = normalize(vec3f(-(gxB + ripSlope.x), 1.0, -(gzB + ripSlope.y)));

  // The normal needs the distance itself, so measure it first.
  //
  // This is the fix for the pale blobs that kept sliding over the right-hand
  // side of the lagoon. Far out, one pixel of water spans several mesh cells,
  // so the finite difference above samples the mesh's own staircase and the
  // normal jumps between neighbouring pixels. A 640-power glint multiplies that
  // jump by a few hundred, and the result is not glitter but soft white clouds —
  // and because the camera moves, they crawl. Distant water does read flat to
  // the eye, so flatten the normal with distance and let only the near rings
  // carry relief.
  let camDist = length(in.wp - U.camPos.xyz);
  let flatF = smoothstep(34.0, 72.0, camDist);
  n = normalize(mix(n, vec3f(0.0, 1.0, 0.0), flatF * 0.90));

  let ripples = abs(bilinRip(p)) * U.water.w;

  let V = normalize(U.camPos.xyz - in.wp);
  let tY = terrainY(p.x, p.y);
  let dep = sea - tY;

  // Dry sand under the water plane is drawn by the terrain pass alone. Letting
  // it show through a half-opaque film is what turned the beach into a milky
  // white smear, so the surface simply is not there above the waterline.
  if (dep < 0.02) { discard; }

  // ---- how much water sits between the eye and the sand
  // A vertical depth says nothing about a shallow angle: at grazing incidence
  // the line of sight crosses metres of water over a centimetre of sand. Divide
  // by the vertical component to get the real path, which is what the tint and
  // the alpha both follow.
  let pathL = clamp(dep / max(abs(V.y), 0.12), 0.0, 26.0);

  // These are linear-light values, not the colour you want to see: everything
  // that reaches the screen goes through tonemap(), which lifts mid values by
  // roughly a gamma and a half. Handing it a bright turquoise here is what
  // turned the lagoon into a white slab — the surface has to start dark and be
  // lit, not start bright and be drawn.
  // The red channel here is not decoration. At 0.055 the body had no warm content
  // of its own, so every warm term below had to be added on top of a pigment that
  // started out cold — and at a five-degree sun those terms are the only warm
  // light in the frame. A little red in the base lets the same warmth land as
  // tint instead of as paint. Small on purpose: a lagoon is still turquoise.
  let shallow = vec3f(0.082, 0.400, 0.368);
  let mid     = vec3f(0.030, 0.420, 0.432);
  let abyss   = vec3f(0.004, 0.070, 0.160);
  // The shelf here bottoms out around two metres and the camera reads that whole
  // band, so the old ramps put the entire readable lagoon on the wrong side of
  // their midpoints: it was deep-blue mid everywhere except a thin ring at the
  // shore. A Maldivian lagoon is turquoise out to where it drops off, and that
  // drop is what the ramp should follow.
  var body = mix(shallow, mid, smoothstep(0.05, 1.4, dep));
  body = mix(body, abyss, smoothstep(1.4, 5.0, dep));
  // Beer–Lambert: the light that leaves the water is the light the sand sent up,
  // minus what the water ate on both trips. Red dies first, which is the whole
  // reason a lagoon reads turquoise instead of merely blue.
  let absorb = vec3f(0.34, 0.085, 0.060);
  body = body * exp(-absorb * pathL * 0.42);
  // The three constants above describe noon. Under a nine-degree sun they stayed
  // a cold saturated turquoise while the sky above them was copper, and the
  // frame read as two pictures glued together. Take the hue from the light that
  // is actually standing over the water: red-minus-blue on the horizon measures
  // how warm that light is, so a blue noon horizon leaves the body alone and
  // dawn and golden hour pull it toward the sand's own warmth. The additive term
  // is what does the work — multiplying cannot lift a body whose red channel is
  // 0.02, no factor brings it up to where a copper sky can meet it.
  // Yellow excess, not red excess — see skyRefl above for why the difference
  // matters. Dawn's pink horizon scores low here and keeps its own colour.
  let warm = clamp((U.skyHor.g - U.skyHor.b) * 7.0, 0.0, 1.0) * (1.0 - U.misc.z);
  // Warm light does not tint a turquoise body, it replaces its pigment. Every
  // earlier attempt multiplied the base by something warm-leaning, and it could
  // not work: the base's green is fourteen times its red, so no multiplier that
  // also kept the lagoon bright could lift red past green. The result walked
  // from olive to grey. So the hue is rebuilt from the body's own brightness
  // instead — green is the channel that says how much water is lit here, and the
  // warm version spends that same brightness on red rather than on green.
  // Building up. It was a warning. Now that the deep water could be repointed at
  // the sky, the ONLY thing a warm body does is make it visible.
  //
  // Warmth is a shallow-water phenomenon. The copper light is the sun crossing
  // a metre of sand and coming back up; out where the shelf falls away there is
  // nothing to bounce off, and the water's own pigment is all that is left. The
  // first version applied warm at full strength to every depth, so at golden
  // hour the far lagoon was repainted copper too and the whole frame collapsed
  // toward one hue — a dust storm, not a sunset. A depth gate fixes that without
  // touching the 7.0 hue test: near shore nothing changes, out past the drop the
  // body keeps its turquoise and meets the copper sky as contrast.
  // The gate stays near the shelf break. Widening it to the whole lagoon was
  // tried and it repaints the deep water copper too, which collapses the frame
  // into one dust-coloured sheet — the exact failure the gate exists to prevent.
  let warmDep = mix(0.26, 1.0, smoothstep(3.2, 0.22, dep));
  let warmAll = warm * warmDep;
  let lum = dot(body, vec3f(0.22, 0.62, 0.16));
  body = mix(body, vec3f(lum * 1.62, lum * 0.92, lum * 0.46), warmAll * 0.88);
  // The additive term takes the sun's own colour, not the horizon's: the horizon
  // at golden hour is already half-way to white haze, and adding that lifted the
  // green as much as the red. The sun is the saturated copper in the frame.
  body = body + mix(U.skyHor.rgb, U.sunCol.rgb, 0.78) * body.g * warmAll * 0.34;
  // Light that crossed the shallow water, hit the sand, and came back up. This is
  // where a low sun actually warms a lagoon: out in the deep the only warmth is
  // the sky's reflection, but the first metre of sand under five degrees of sun
  // is the one broad, genuinely warm surface in the picture. Gated on depth, not
  // on path length — the thing being asked for is "you can see the bottom".
  // This is the term that draws the pale ellipse around the sandbar. It is gated
  // on a depth contour, and a contour on a gently shelving bottom is a closed
  // curve several metres across: bright inside, dark outside, read as a ring laid
  // on the water. A contour cannot be the gate. Take the same falloff and make it
  // a smooth square of the (already continuous) depth instead, so there is no
  // crease anywhere for the eye to trace.
  // ...and then faded by the PATH length, which is the one thing this term must
  // not follow: at eye level the foreground is a grazing view across a hand's
  // depth of water, so the path is long while the bottom is right there and
  // fully lit. Fading on path deleted exactly the sand the term exists to show
  // and left the near lagoon as dark deep-sea teal.
  // Measured at golden hour: the shallow shelf right of the island came back
  // rgb(123,135,124) — R, G and B within twelve of each other, a neutral grey
  // sitting exactly where the picture most needs warm sand under clear water.
  // The cause is this exponent's falloff, not the light. At 0.62 the bracket is
  // already 0.07 at one metre and 0.005 at 1.6 metres, so the sand rebounds
  // almost nothing anywhere it is actually visible, and the whole shelf is lit
  // by the cold body colour alone. The weight is still a smooth power of depth
  // (no contour gate, so no ellipse), it simply reaches as far as a low sun
  // genuinely reaches into water you can see the bottom of.
  let sandy = pow(clamp(1.0 - dep * 0.44, 0.0, 1.0), 2.0) * warm;
  body = body + U.sunCol.rgb * sandy * 0.42 * exp(-dep * 0.55);
  // Under a night preset the lagoon was still the bright afternoon turquoise with
  // a small discount (0.62). Real night water is near black except where the moon
  // lays a path on it and the plankton glow. 0.62 was chosen when this term also
  // had to serve as a mild dusk tint; it now only has to be night.
  // Night is not the absence of a lagoon, but it is still night. The first pass
  // opened the body to 0.40 and added 0.052 of teal on top; that, plus a
  // full-field glow term, turned the whole sea into a bright turquoise sheet
  // under a black sky — an artificial pool with a lid on it. Plankton is a
  // decoration on dark water, not a replacement for it, so the body stays close
  // to dark and the light comes from the field below.
  body = body * mix(1.0, 0.22, U.misc.z);
  body = body + vec3f(0.004, 0.026, 0.024) * U.misc.z;

  // what the water is lit by
  let L = normalize(U.sunDir.xyz);
  let ndl = clamp(dot(n, L), 0.0, 1.0);

  // ---- the swell cutting the surface into light and shade
  // Colouring by depth alone gave every square metre at the same depth the same
  // tone. At noon the sun is overhead and the small lit terms paper over that;
  // under a five-degree sun ndl collapses to about 0.09, every direct term goes
  // out, and what was left was one flat slab of teal across the whole foreground
  // — the geometry's rolling never reached the colour at all.
  //
  // A wave face tilted toward the light gathers more of it than one tilted away,
  // which is why a meadow reads as bands instead of a green sheet, and n.xz is
  // exactly that tilt. Its dot with the sun's own horizontal bearing signs it:
  // faces turned toward the sun brighten, faces turned away darken. The weight
  // stays under a third on purpose — this is meant to carve the swell into
  // facets, and a stronger factor stripes the lagoon like a zebra.
  let sunAzi = normalize(L.xz + vec2f(1e-3, -1e-3));
  // 4.5 amplified the normal's xz so hard that the mesh's own steps survived
  // the amplification: under a low sun the lagoon's whole foreground came back
  // as evenly spaced horizontal scratches, the relief of the grid rather than
  // the relief of the wave. The shading still has to carve the swell, so the
  // gain comes down and the weight with it — banding is worse than flatness.
  let facing = clamp(dot(n.xz, sunAzi) * 2.0, -0.70, 0.70);
  body = body * (1.0 + facing * 0.32);

  // subsurface scattering: light that entered the wave and came back out
  let thick = clamp(0.5 - (in.wp.y - sea) * 1.8, 0.0, 1.0);
  // a low sun behind the wave lights the thin crests from inside. The weight is
  // small on purpose: at 0.34 this term painted every crest a milky white and
  // the lagoon looked like it was boiling — scattering tints a crest, it does
  // not whiten it.
  let back = clamp(dot(V, -L) * 0.5 + 0.5, 0.0, 1.0);
  let sss = pow(back, 7.0);
  body = body + vec3f(0.10, 0.58, 0.50) * (sss * thick * 0.10 + ndl * 0.045) * U.sunDir.w;

  // crests catch light
  // The moon-sized bug in this line was the coefficient: 0.16 of the sun colour
  // added on every crest turned each swell crest into a pale band running the
  // width of the lagoon. A crest does catch more light than the trough, but it
  // catches it as a tint, not as a coat of white paint.
  let crest = smoothstep(0.16, 0.50, in.wp.y - sea);
  body = body + vec3f(0.30, 0.74, 0.64) * crest * 0.040 * ndl * U.sunDir.w;

  // reflection
  // Reflection gets its own, flatter normal.
  //
  // The pale clouds that slid over the right-hand lagoon were the sky gradient
  // read through a normal that jittered from pixel to pixel. Out there one
  // pixel spans several metres of mesh, so the finite difference that builds
  // the normal ends up sampling the mesh's own steps. The gradient is steepest
  // near the horizon, so those tiny angle changes swung the reflected colour
  // between two distant sky tones and painted soft patches that crawled with
  // the camera. Flattening only the normal used for reflection costs nothing
  // visible: water that far away reads as a mirror by definition.
  // Two things went wrong here, and both came from sampling the sky through a
  // normal that is built by finite differences on the water mesh. Far out, one
  // pixel covers several metres of mesh, so the normal jumps between the mesh's
  // own steps; near the horizon the sky gradient changes steeply enough that a
  // one-degree swing in the reflected ray moves the colour by roughly a tenth.
  // The result was pale clouds crawling over the right-hand lagoon. Out there
  // the surface is a mirror: blending the whole reflection normal to straight up
  // past sixteen metres leaves a smooth per-pixel direction, so there is nothing
  // left to jump between. Wave distortion survives close in, where it is seen.
  let reflDist = length(in.wp - U.camPos.xyz);
  // Both flattening ramps used to start at three metres, which is close enough
  // that the whole readable middle of the lagoon was already a flat mirror: the
  // surface came back as one smooth sheet of sky with no ripples in it, and the
  // water read as plastic. The sun lobe that made the crawl dangerous is gone
  // from skyRefl and the glitter term is faded out past sixteen metres, so the
  // only thing left to hide is the mesh's own staircase, and that lives well
  // beyond forty.
  // Was 26 to 58 metres. Flattening that early did stop the mesh's own staircase
  // from flickering through the reflection, but it also turned the whole readable
  // middle distance into a mirror: past 26 metres there is no per-pixel normal
  // left, hence no ripple shading, hence no depth cue at all. That is the other
  // half of why the middle of the lagoon read as one smooth grey sheet. The
  // staircase lives in the far mesh, well past 40 metres, so move the ramp out to
  // where the problem actually is and keep the ripples through the composition.
  let nRefl = normalize(mix(n, vec3f(0.0, 1.0, 0.0), smoothstep(42.0, 88.0, reflDist)));
  let R = reflect(-V, nRefl);
  var refl = skyRefl(vec3f(R.x, abs(R.y), R.z));
  // Schlick with a glassy base: 0.02 at your feet, near total at the horizon —
  // this is what puts the sky on the far water and keeps the sand visible close in.
  let F = 0.02 + 0.98 * pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.4);
  // A warm sky reflected in water keeps its warmth but not its brightness: the
  // surface only returns part of what it receives, and at a grazing angle it is
  // mostly the far, hazy, warm band up there that comes back. Without this the
  // horizon's copper arrived as a neutral grey sheen and the two halves of the
  // frame still did not belong to the same photograph.
  let warmH = clamp((U.skyHor.g - U.skyHor.b) * 7.0, 0.0, 1.0) * (1.0 - U.misc.z);
  // Same correction as the body tint: green has to come down, or a copper sky
  // returned off a turquoise sea averages to grey-green. Water at a grazing angle
  // mirrors the sky it sits under, not a washed-out version of it.
  refl = refl * mix(vec3f(1.0), vec3f(1.42, 0.94, 0.60), warmH * 0.90);

  var col = mix(body, refl, clamp(F, 0.03, 0.92));

  // ---- sun glitter
  // A mirror-flat patch of water reflects the sky, never the sun, so the
  // highlight is gated on local slope. Two exponents do the work: a broad one
  // that turns the whole swell into a sheen, and a tight one for the individual
  // flashes. Multiplying by noise scatters the tight one into broken diamonds
  // instead of one smooth blob — flat water sparkles because it is never flat.
  let Hh = normalize(L + V);
  let sp = clamp(dot(n, Hh), 0.0, 1.0);
  // Everything bright in the water is gated by how flat the surface is here.
  //
  // The pale clouds that slid over the right-hand side of the lagoon were the
  // reflection's own sun image: 1200th power of the half-vector. Out on open
  // water the normal is nearly straight up, and a nearly-straight-up normal
  // reflecting a low sun already scores ~0.998 — inside the lobe. All it took
  // was the one-degree ripples of the outer mesh to swing neighbouring pixels
  // in and out of it, and the surface lit up in soft patches that moved with
  // the camera. Gating on flatness keeps the sun's image on genuinely calm
  // water, which is both what the eye expects and what stops the crawling.
  let calm = smoothstep(0.55, 0.99, n.y);
  let spk = vnoise(p * 13.0 + vec2f(U.camPos.w * 1.7, -U.camPos.w * 1.3));
  let sparkle = smoothstep(0.52, 0.96, spk);
  var glint = pow(sp, 640.0) * 0.90 * (0.05 + sparkle) * calm;
  // Glitter only exists where the eye can resolve it as glitter. Far out a
  // single pixel spans metres of surface, so a 640-power lobe either misses
  // entirely or fires at full strength, and the two alternate per pixel — the
  // far lagoon filled with a field of bright salt grains. Past twenty metres
  // the surface reads as a mirror anyway, so the flash is faded out there.
  let glintNear = 1.0 - smoothstep(6.0, 26.0, reflDist);
  glint = glint * glintNear;
  // The 640-power lobe is a point on the water, not a field of them: it only
  // fires where the half-vector lands within a fraction of a degree of the
  // surface normal. At noon the sun stands 72 degrees up, so the geometry that
  // satisfies it sits well past the readable foreground, and the near water came
  // back as one even turquoise sheet — crisp, but with nothing sparkling in it.
  //
  // A wider lobe cannot fix that (0.42 to the ninetieth power is zero), so the
  // flashes near the camera come from the other half of what makes glitter: the
  // patches of surface tilted enough to happen to catch the sky. Same noise
  // mask, same calm gate, a slope weighting instead of a step function.
  let sheen = smoothstep(0.70, 0.94, spk) * pow(sp, 5.0) * 0.13 * calm * glintNear;
  glint = glint + sheen;
  // The flashes themselves. Additive on purpose: a glint is light that reaches
  // the eye without being tinted by the water, which is why it is not blended
  // into the surface colour. Dimmed at night so the moon does not read as a sun.
  col = col + U.sunCol.rgb * glint * U.sunDir.w * (1.0 - 0.55 * U.misc.z) * 1.10;

  // ---- the sun's road
  // At nine degrees the mirror image of the sun sits hundreds of metres out,
  // long past the water mesh, so the tight lobe above can never place it inside
  // the frame — the warmest light in the picture left no mark on the water at
  // all, which is why golden hour read as a warm sky over a neutral pond. What
  // the eye reads as that road is not a point but a wide band: every patch whose
  // azimuth lines up mirrors the same sun, and surface roughness is what smears
  // it sideways. So this term ignores the per-pixel normal and asks only whether
  // this patch sits on the line between the camera and the sun, with an
  // exponent that collapses toward a point as the sun climbs.
  let Lh = normalize(vec2f(L.x, L.z));
  let Vh = normalize(vec2f(V.x, V.z));
  // A patch mirrors the sun into the eye where the reflected view ray points at
  // the sun, which for a horizontal surface means the two horizontal directions
  // agree: V's xz and L's xz point the same way. The first draft had this
  // negated, so the road appeared wherever the camera was turned AWAY from the
  // sun — which is most of the frame at golden hour — and a 0.40 wash of sun
  // colour over the whole lagoon turned it into a slab of warm milk. The sign is
  // the physics, not a taste knob.
  let align = clamp(dot(Lh, Vh), 0.0, 1.0);
  let lowSun = 1.0 - smoothstep(0.20, 0.62, L.y);
  // The road starts a few metres out. At the camera's own feet the surface is
  // seen too steeply for a nine-degree sun to mirror into it, and a band that
  // reaches the bottom of the frame reads as a spotlight.
  let road = pow(align, mix(64.0, 18.0, lowSun)) * lowSun * smoothstep(3.0, 13.0, reflDist);
  col = col + U.sunCol.rgb * road * 0.30 * U.sunDir.w * (1.0 - 0.7 * U.misc.z);

  // ---- foam
  // Three octaves at different speeds: one broad patch, one mid lace, one fine
  // grain. A single noise layer at one scale reads as blotches no matter how it
  // is thresholded, because the eye can see that every blob is the same size.
  let ft = U.camPos.w;
  let f1 = fbm(p * 2.4 + vec2f(ft * 0.14, -ft * 0.10));
  let f2 = fbm(p * 8.6 - vec2f(ft * 0.30, ft * 0.22));
  let f3 = fbm(p * 19.0 + vec2f(ft * 0.42, ft * 0.28));

  let shore = 1.0 - smoothstep(0.02, 0.22, dep);
  // The fine octave used to carry 0.28 here. At nineteen cycles per metre a
  // pixel out past ten metres covers several of them, so the layer stops being
  // lace and becomes a uniform field of pale grains lying on the water. It is
  // still wanted up close, where individual flecks are resolvable, so the
  // weight fades in with distance instead of being cut outright.
  let fineFade = 1.0 - smoothstep(5.0, 22.0, reflDist);
  let lace = f1 * 0.55 + f2 * 0.45 + f3 * 0.30 * fineFade;
  // Threshold high on purpose: the mean of that sum is already around 0.6, so
  // gating near the mean turns the whole lagoon white. Only the top of the noise
  // gets paint, which is what makes foam read as lace instead of a film.
  var foam = shore * smoothstep(0.64, 0.98, lace) * smoothstep(0.34, 0.92, U.water.y + 0.25);
  // Crest foam is the one that has to stay nearly invisible. A tall swell is
  // mostly water, not spray, and painting every crest white reads as snow on
  // the surface — it was the main reason the lagoon looked frozen.
  // Crest foam reads the shaken height field, not the vertex position. The
  // outer water mesh is much coarser than the wave field, so interpolated vertex
  // heights jitter from one another and gating spray on them sprayed white
  // patches across half the lagoon. The analytic height is smooth everywhere.
  let surfH = hAt(p) - sea;
  let crestFoam = smoothstep(0.58, 0.86, surfH) * smoothstep(0.94, 1.12, f2 * 0.75 + f3 * 0.25);
  foam = foam + crestFoam * 0.035 * smoothstep(0.92, 1.24, U.water.y);

  // ---- pebble rings
  // The compute field carries the ring that actually bends the surface, but by
  // the time it is down to a tenth of a unit the eye cannot find it. Drawing the
  // ring a second time, analytically, fixes the read: a thin bright band whose
  // radius is the pebble's age times a speed, fading as it spreads.
  var ringGlow = 0.0;
  for (var i = 0; i < 8; i = i + 1) {
    if (f32(i) >= U.pebInfo.x) { break; }
    let pb = U.peb[i];
    let age = pb.z;
    if (age < 0.0 || age > 7.0) { continue; }
    let d = length(p - pb.xy);
    let r = age * 2.15;
    // A ring on water is a line, not a band. The earlier 0.22 + age*0.20 made a
    // 30 cm wide solid stroke at arm's length, which read as piped cream around
    // the drop. Width has to stay small against the radius and grow only slowly.
    let band = 0.055 + age * 0.028;
    // a soft-edged band, plus a second faint ring a step behind it so the train
    // reads as a wave rather than a drawn circle
    let ring = smoothstep(band, 0.0, abs(d - r));
    let trail = smoothstep(band * 1.6, 0.0, abs(d - r + 0.46)) * 0.34;
    let fade = exp(-age * 0.52) * pb.w;
    ringGlow = ringGlow + (ring + trail) * fade;
  }
  ringGlow = clamp(ringGlow, 0.0, 1.4);
  // Flecked, not filled. Multiplying the ring by the fine foam noise cuts the
  // line into particles, so it reads as water that was struck instead of a
  // painted circle; the peak addition also came down from 0.50.
  let ringFoam = smoothstep(0.26, 0.90, ringGlow) * smoothstep(0.28, 0.74, f3 * 0.70 + f2 * 0.50);
  foam = foam + ringFoam * 0.40;
  foam = clamp(foam, 0.0, 0.42);
  // Foam is not paint. Pure white against a turquoise lagoon reads as snow, so it
  // takes the colour of the light around it and only brightens toward the top.
  let foamL = tonemap(vec3f(0.88, 0.94, 0.92));
  col = mix(col, foamL, foam);
  // the crest of the ring catches the sun even where no foam formed
  col = col + vec3f(0.55, 0.90, 0.88) * ringGlow * 0.16 * U.sunDir.w * (1.0 - U.misc.z);

  // bioluminescent night — glowing crests and ripple trails
  let night = U.misc.z;
  // Weighted onto the moving edges — the surf line and the pebble rings — rather
  // than spread evenly. At 0.16 the shore band did nothing once the water body was
  // pushed down to 0.30, and the preset read as a dark afternoon instead of
  // bioluminescence; light on the water is what the eye looks for at night.
  // Plankton blooms are patchy and they pulse. A uniform skirt around the whole
  // island read as a lamp hidden under the shallows, so the surf part of the glow
  // is cut by noise that drifts with time.
  let bloom = 0.18 + 1.55 * fbm(p * 3.4 + vec2f(U.camPos.w * 0.22, U.camPos.w * 0.13));
  // A glowing sea glows everywhere, not only at the surf line, but it glows in
  // threads. The first version used a broad patch field at 0.26 with the gate
  // half-open, and since fbm averages near 0.5 the gate was open over most of the
  // lagoon: a solid luminous sheet with soft edges, which reads as a light
  // under the water rather than as swimming plankton. Both ends are moved now —
  // a higher gate and a wider one, so the field is only lit on its own ridges,
  // and the ridges meander like drifting colonies instead of filling the frame.
  // 1.35 cycles per metre made colonies about a metre across. Past twenty metres
  // one pixel spans several of them, so the patch network stopped reading as
  // colonies and became a uniform field of dots lying on the water — television
  // snow with a green tint. Colonies that are metres wide survive the projection
  // at every distance the frame shows.
  let fieldN = fbm(p * 0.55 + vec2f(U.camPos.w * 0.06, -U.camPos.w * 0.04));
  // A single smoothstep over one octave gives a blob with a round, smooth edge —
  // at 0.56/0.84 the patches came out as fat teal lozenges, closer to dollops of
  // cream than to swimming plankton. Real colonies are a field of threads whose
  // outlines follow their own fine structure, so a second field at four times
  // the frequency is used to eat into the patch instead of lighting it evenly:
  // where the fine field is low the patch falls back to a dim trace, which is
  // what gives the ragged, streaky edge.
  let fineN = fbm(p * 5.4 + vec2f(-U.camPos.w * 0.19, U.camPos.w * 0.12));
  let patchN = smoothstep(0.60, 0.82, fieldN);
  let threads = smoothstep(0.44, 0.74, fineN);
  let field = patchN * mix(0.22, 1.0, threads);
  // The threads also sit deeper in the water than anything the eye can resolve
  // per-pixel, so they carry the fine grain of a moving colony rather than a
  // smooth gradient.
  let grain = 0.55 + 0.45 * f2;
  // The surf band was carrying 0.62 and it is the one part of the glow that the
  // eye finds artificial: a ribbon of even width and even brightness wrapped
  // around the island, brighter than the water inside it, reads as a lamp under
  // the shallows rather than as plankton. Plankton is brightest where it is
  // disturbed — the surf line is right, the *uniform* ribbon is the mistake. A
  // third of the old weight keeps the line readable and lets the noise make it
  // patchy.
  //
  // The open-water field also has to stop at the distance where it stops being
  // resolvable, or the far lagoon fills with individual glowing pixels.
  let fieldFade = 1.0 - smoothstep(9.0, 30.0, reflDist);
  // The open-water field was added everywhere its gate opened, and the gate is a
  // smoothstep over fbm, so a third of the lagoon came back lit at once: a
  // continuous luminous sheet with soft edges, which reads as light under the
  // water rather than as plankton. Colonies are visible where the water is
  // disturbed, so the field now rides the same crest term as the surf — on a
  // swell's own shoulders, dark in the troughs between them. That is what breaks
  // the wash into flecks that move with the waves.
  let fieldLit = field * mix(0.16, 1.0, smoothstep(0.30, 0.85, crest));
  let glow = crest * 0.50 + ringGlow * 2.6
           + shore * bloom * 0.30 * smoothstep(0.35, 0.90, threads)
           + fieldLit * grain * 0.075 * fieldFade;
  col = col + vec3f(0.12, 1.45, 1.15) * glow * night * 1.15;

  // transparency: Beer–Lambert on the real path, plus the sky's own reflection
  // toward the horizon. Deep water stops being see-through entirely, shallow
  // water shows the sand and the caustics on it.
  // 0.55 per unit was a murky-pond extinction: across six units of path it
  // reached 96 percent opacity, so even a metre of water over bright sand came
  // out as painted plastic and the sea floor may as well not have been drawn.
  // Clear lagoon water is the opposite — you read individual coral heads four
  // metres down. 0.17 keeps the near field see-through and still closes up by
  // the time a grazing ray has crossed twenty units of water.
  var alpha = 1.0 - exp(-0.17 * pathL);
  alpha = clamp(alpha + smoothstep(4.0, 9.0, dep), 0.0, 1.0);
  alpha = max(alpha, foam * 0.95);
  alpha = max(alpha, clamp(F * 0.90, 0.0, 0.96));
  // Far water has to close up. A surface that is already faded to the haze
  // colour but still half transparent blends with the sky a second time, and
  // the horizon comes out milky instead of solid.
  alpha = max(alpha, smoothstep(60.0, 110.0, camDist));
  alpha = clamp(alpha, 0.05, 0.995);

  let c = fogMix(tonemap(col), in.wp);
  return vec4f(c, alpha);
}
`;

const WGSL_CRITTER = /* wgsl */`
@group(0) @binding(0) var<uniform> U : Frame;
@group(1) @binding(0) var<uniform> M : mat4x4f;
@group(1) @binding(1) var<uniform> C : vec4f;   // x phase, y kind (0 turtle, 1 manta), z finGlow

struct CO {
  @builtin(position) pos : vec4f,
  @location(0) wp : vec3f,
  @location(1) nrm : vec3f,
  @location(2) col : vec3f,
  @location(3) sway : f32,
};

@vertex
fn vsCritter(@location(0) p : vec3f, @location(1) n : vec3f,
             @location(2) c : vec3f, @location(3) s : f32) -> CO {
  var o : CO;
  var q = p;
  let t = U.camPos.w;
  let ph = C.x;

  if (C.y < 0.5) {
    // turtle: flippers paddle; sway is the limb index
    if (s > 0.5) {
      let out = smoothstep(0.18, 0.95, abs(p.x));
      let stroke = sin(t * 2.05 + ph + p.z * 0.9) * 0.30;
      q.y = q.y + stroke * out * sign(p.x);
    }
  } else {
    // manta: wing flap grows toward the tip
    let span = s * s;
    let flap = sin(t * 1.55 + ph - s * 1.35) * 0.52 * span;
    q.y = q.y + flap;
    q.z = q.z + flap * 0.28 * sign(p.x);
  }
  let wp = (M * vec4f(q, 1.0)).xyz;
  o.wp = wp;
  o.nrm = normalize((M * vec4f(n, 0.0)).xyz);
  o.col = c;
  o.sway = s;
  o.pos = U.viewProj * vec4f(wp, 1.0);
  return o;
}

@fragment
fn fsCritter(in : CO) -> @location(0) vec4f {
  let L = normalize(U.sunDir.xyz);
  let V = normalize(U.camPos.xyz - in.wp);
  var n = normalize(in.nrm);
  if (dot(n, V) < 0.0) { n = -n; }

  let ndl = clamp(dot(n, L), 0.0, 1.0);
  let under = clamp(1.0 - (in.wp.y - U.water.z) * 0.8, 0.0, 1.0);
  var col = in.col * (U.amb.rgb * (0.55 + 0.35 * n.y) + U.sunCol.rgb * ndl * U.sunDir.w);

  // light filtering down through the water, plus a cool caustic wash
  col = col * mix(vec3f(0.55, 0.90, 0.92), vec3f(1.0), under * 0.5);
  // Depth absorption. Without it a fish is drawn at full colour no matter how
  // much water sits over it, so anything pale turned into a bright shape
  // floating on the surface instead of something swimming underneath it.
  let dep = max(U.water.z - in.wp.y, 0.0);
  col = col * exp(-vec3f(0.50, 0.16, 0.12) * dep * 1.6);
  col = col * (0.55 + 0.45 * (1.0 - U.misc.z));
  let caus = causticPattern(in.wp.xz * 0.9) * U.misc.y * 0.55;
  col = col + in.col * vec3f(0.5, 1.0, 0.9) * caus * (1.0 - under * 0.4);

  let h = normalize(L + V);
  col = col + U.sunCol.rgb * pow(clamp(dot(n, h), 0.0, 1.0), 26.0) * U.sunDir.w * 0.35;

  // dark dorsal rim + night glow along the fin edges
  let rim = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 2.6);
  col = col + U.amb.rgb * rim * 0.20;
  col = col + vec3f(0.12, 1.05, 0.95) * rim * U.misc.z * 0.55;

  return vec4f(tonemap(fogMix(col, in.wp)), 1.0);
}
`;

const WGSL_PART = /* wgsl */`
@group(0) @binding(0) var<uniform> U : Frame;

struct PartOut {
  @builtin(position) pos : vec4f,
  @location(0) uv : vec2f,
  @location(1) heat : f32,
};

@vertex
fn vsPart(@location(0) corner : vec2f,
          @location(1) ipos : vec3f,
          @location(2) size0 : f32,
          @location(3) seed : f32) -> PartOut {
  var o : PartOut;
  let t = U.camPos.w;
  let drift = vec3f(sin(t * 0.30 + seed * 8.0) * 1.4,
                    sin(t * 0.42 + seed * 5.0) * 0.35,
                    cos(t * 0.26 + seed * 6.0) * 1.4);
  var wp = ipos + drift;
  wp.y = wp.y + sin(t * 0.9 + seed * 12.0) * 0.16;

  // billboard along the camera basis handed over in the uniforms
  let right = U.camRight.xyz;
  let up    = U.camUp.xyz;
  let size = size0 * (0.7 + 0.3 * sin(t * 2.2 + seed * 20.0));
  wp = wp + (right * corner.x + up * corner.y) * size;

  o.uv = corner;
  o.heat = 0.55 + 0.45 * sin(t * 1.7 + seed * 30.0);
  o.pos = U.viewProj * vec4f(wp, 1.0);
  return o;
}

@fragment
fn fsPart(in : PartOut) -> @location(0) vec4f {
  let d = length(in.uv);
  let a = smoothstep(1.0, 0.05, d);
  let core = smoothstep(0.45, 0.0, d);
  let day = vec3f(0.62, 0.74, 0.72);
  let night = vec3f(0.25, 1.35, 1.15);
  let c = mix(day, night, U.misc.z);
  // Daylight plankton is invisible to the eye: a few hundred additive sprites at
  // 0.10 each pile up into the soft white clouds that drifted over the lagoon
  // and no amount of work on the water shader could remove them — they were
  // never part of the water. Only the night glow is worth drawing.
  let alpha = a * (0.012 + 0.70 * U.misc.z) * in.heat;
  return vec4f(c * (0.35 + core * 1.4), alpha);
}
`;
